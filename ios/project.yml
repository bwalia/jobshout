# XcodeGen spec. Generate the project with `xcodegen` (see README.md); the
# .xcodeproj is not committed.
name: JobShout
options:
  bundleIdPrefix: com.jobshout
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  defaultConfig: Debug

# Debug talks to int, Staging to acc, Release to prod. Each platform × config
# has its own bundle id so installs sit side by side; every one must be listed
# in the ring's APPLE_CLIENT_IDS for Sign in with Apple.
configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set your team locally or via xcodebuild DEVELOPMENT_TEAM=...; never commit it.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      JOBSHOUT_ENVIRONMENT: int
      APS_ENVIRONMENT: development
    Staging:
      JOBSHOUT_ENVIRONMENT: acc
      APS_ENVIRONMENT: production
    Release:
      JOBSHOUT_ENVIRONMENT: prod
      APS_ENVIRONMENT: production

packages:
  JobShoutKit:
    path: JobShoutKit

targets:
  JobShout:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: JobShoutKit
        product: JobShoutFeatures
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.dev
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.staging
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JobShout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JobShoutEnvironment: $(JOBSHOUT_ENVIRONMENT)
        JobShoutKeychainAccessGroup: $(AppIdentifierPrefix)com.jobshout.shared
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Confirm it's you before approving an agent's action.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jobshout.oauth
            CFBundleURLSchemes: [jobshout]
    entitlements:
      path: App/JobShout.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jobshout.shared

  JobShoutMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/App
    dependencies:
      - package: JobShoutKit
        product: JobShoutFeatures
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.mac.dev
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.mac.staging
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.mac
    info:
      path: Mac/App/Info.plist
      properties:
        CFBundleDisplayName: JobShout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JobShoutEnvironment: $(JOBSHOUT_ENVIRONMENT)
        JobShoutKeychainAccessGroup: $(AppIdentifierPrefix)com.jobshout.shared
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "15.0"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jobshout.oauth
            CFBundleURLSchemes: [jobshout]
    entitlements:
      path: Mac/App/JobShoutMac.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jobshout.shared
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  JobShoutWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/App
    dependencies:
      - package: JobShoutKit
        product: JobShoutFeatures
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.watchkitapp.dev
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.watchkitapp.staging
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.watchkitapp
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: JobShout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JobShoutEnvironment: $(JOBSHOUT_ENVIRONMENT)
        JobShoutKeychainAccessGroup: $(AppIdentifierPrefix)com.jobshout.shared
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/App/JobShoutWatch.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jobshout.shared

  JobShoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: JobShout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jobshout.app.uitests

schemes:
  JobShout:
    build:
      targets:
        JobShout: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JobShoutUITests
    archive:
      config: Release
  JobShout (Staging):
    build:
      targets:
        JobShout: all
    run:
      config: Staging
    archive:
      config: Staging
  JobShoutMac:
    build:
      targets:
        JobShoutMac: all
    run:
      config: Debug
    archive:
      config: Release
  JobShoutWatch:
    build:
      targets:
        JobShoutWatch: all
    run:
      config: Debug
    archive:
      config: Release
