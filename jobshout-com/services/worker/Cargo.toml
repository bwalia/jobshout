[package]
name = "jobshout-com-worker"
description = "JobShout.com worker (email outbox mailer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jobshout-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
jobshout-notifications = { path = "../../crates/jobshout-notifications" }
jobshout-observability = { path = "../../crates/jobshout-observability" }
jobshout-storage = { path = "../../crates/jobshout-storage" }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
tokio = { workspace = true }
tracing = { workspace = true }
