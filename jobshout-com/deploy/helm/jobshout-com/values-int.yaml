env: int
host: int.jobshout.com

# image.tag is injected by Ring Promoter (--set image.tag=<jsc-v…>).

api:
  replicas: 1

web:
  replicas: 1
  apiURL: "http://jobshout-com-api.int.svc.cluster.local:8088"

postgres:
  enabled: true
  storage: 10Gi
  # int proving-ring default; override via helm --set-string for stronger secrets.
  password: jobshout

insights:
  seedSamples: true

showcase:
  seedSamples: true

# int's stateless pods landed on bwalia-latitude7300, a laptop that drops out of
# the cluster when it sleeps (26 Sep 2026: every int page returned 502). Keep
# them on a LAN worker with headroom.
nodeSelector:
  kubernetes.io/hostname: debian004
