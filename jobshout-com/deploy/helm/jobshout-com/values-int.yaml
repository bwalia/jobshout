env: int
host: int.jobshout.com

# image.tag is injected by Ring Promoter (--set image.tag=<jsc-v…>).

# int pins these pods to debian004 (nodeSelector below), which is almost fully
# requested; they idle at a few millicores. At the chart's 50-100m a rolling
# update's surge pod could not be scheduled and helm --wait timed out
# (26 Nov 2026, v1.0.249). Limits and memory are unchanged.
api:
  replicas: 1
  resources:
    requests: { cpu: 10m }

web:
  replicas: 1
  apiURL: "http://jobshout-com-api.int.svc.cluster.local:8088"
  resources:
    requests: { cpu: 10m }

postgres:
  enabled: true
  storage: 10Gi
  # int proving-ring default; override via helm --set-string for stronger secrets.
  password: jobshout

insights:
  seedSamples: true

opsapi:
  url: "https://int-opsapi.workstation.co.uk"
  namespace: "jobshout"

nebuladb:
  url: "http://nebuladb.int.svc.cluster.local:8080"

showcase:
  seedSamples: true

# Phase 0/1 flags dark on int until reviewed / SMTP wired in Vault.
membersRich:
  enabled: false
dashboard:
  enabled: false
messaging:
  enabled: false
projectsLive:
  enabled: false
  seedSamples: false
credits:
  enabled: false
  purchasesEnabled: false
aiFeatures:
  enabled: false
hire:
  enabled: false
groups:
  # Phase 4 MVP: browse/create groups, join, posts, comments — enable on int for testing.
  enabled: true
teams:
  enabled: false
emailOutbox:
  enabled: false
worker:
  enabled: false
scheduler:
  enabled: false

# int's stateless pods landed on bwalia-latitude7300, a laptop that drops out of
# the cluster when it sleeps (26 Sep 2026: every int page returned 502). Keep
# them on a LAN worker with headroom.
nodeSelector:
  kubernetes.io/hostname: debian004

# Social sign-in credentials: populate WSL Vault kv path
# jobshout-com/int/oauth (keys listed under oauth in values.yaml).
vaultSecrets:
  - name: jobshout-com-oauth
    store: wslvault-backend
    key: jobshout-com/int/oauth
