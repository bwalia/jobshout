{{- /*
  One ExternalSecret per vaultSecrets entry: ESO copies every key under a
  WSL Vault path into a Kubernetes Secret of the same name. Same pattern as
  the platform chart (deploy/helm/jobshout/templates/vault-secrets.yaml).
*/}}
{{- range .Values.vaultSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "jobshout-com.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1m" | quote }}
  secretStoreRef:
    kind: {{ .storeKind | default "ClusterSecretStore" }}
    name: {{ required "vaultSecrets[].store is required" .store }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "vaultSecrets[].key is required" .key }}
{{- end }}
