{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobshout-com-nginx-config
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      server_tokens off;
      client_max_body_size 25m;

      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      resolver {{ .Values.gateway.resolver }} valid=10s ipv6=off;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 300s;

      server {
        listen 80;

        location /api/ {
          set $up http://jobshout-com-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
          proxy_pass $up;
        }
        location = /health {
          set $up http://jobshout-com-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
          proxy_pass $up;
        }

        location / {
          set $web http://jobshout-com-web.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.web.port }};
          proxy_pass $web;
        }
      }
    }
{{- end }}
