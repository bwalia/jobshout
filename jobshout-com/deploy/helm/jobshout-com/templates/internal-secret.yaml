{{- /*
Shared token the web tier sends with identity headers to the API. The gateway
exposes /api/ publicly, so the API only trusts x-jobshout-user-* headers that
arrive with this token. Generated on first install and kept afterwards.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "jobshout-com-internal" -}}
{{- $token := .Values.secrets.internalToken | default "" -}}
{{- if and (eq $token "") $existing }}
  {{- $token = index $existing.data "JOBSHOUT_INTERNAL_TOKEN" | b64dec -}}
{{- end -}}
{{- if eq $token "" -}}
  {{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-com-internal
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
type: Opaque
stringData:
  JOBSHOUT_INTERNAL_TOKEN: {{ $token | quote }}
