apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-com-api
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
    {{- include "jobshout-com.selector" (dict "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout-com.selector" (dict "name" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout-com.selector" (dict "name" "api") | nindent 8 }}
    spec:
      {{- include "jobshout-com.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z jobshout-com-postgres {{ .Values.postgres.port }}; do
                echo waiting for postgres; sleep 2;
              done
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "jobshout-com.image" (dict "ctx" . "repo" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobshout-com-db
                  key: DATABASE_URL
            - name: PUBLIC_SITE_URL
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: INSIGHTS_STAFF_EMAILS
              value: {{ .Values.insights.staffEmails | default "" | quote }}
            # Agents whose submissions publish without review — only those whose
            # platform has a person approve each item before sending it.
            - name: INSIGHTS_TRUSTED_AGENTS
              value: {{ .Values.insights.trustedAgents | default "" | quote }}
            - name: INSIGHTS_SEED_SAMPLES
              value: {{ .Values.insights.seedSamples | default false | quote }}
            - name: SHOWCASE_SEED_SAMPLES
              value: {{ (.Values.showcase).seedSamples | default false | quote }}
          # envFrom, not env+valueFrom: see the note in web.yaml.
          envFrom:
            - secretRef:
                name: jobshout-com-internal
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-com-api
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    {{- include "jobshout-com.selector" (dict "name" "api") | nindent 4 }}
