apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-com-web
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
    {{- include "jobshout-com.selector" (dict "name" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout-com.selector" (dict "name" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout-com.selector" (dict "name" "web") | nindent 8 }}
    spec:
      {{- include "jobshout-com.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "jobshout-com.image" (dict "ctx" . "repo" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          env:
            - name: JOBSHOUT_COM_API_URL
              value: {{ .Values.web.apiURL | quote }}
            - name: NEXTAUTH_URL
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: PORT
              value: {{ .Values.web.port | quote }}
          # NEXTAUTH_SECRET / AUTH_SECRET arrive via envFrom rather than two
          # `env` entries with valueFrom. `env` is strategic-merged against the
          # live Deployment, and a running pod whose env list predates those
          # entries merges them onto slots that already carry `value`, which
          # the API server rejects:
          #   env[2].valueFrom: may not be specified when `value` is not empty
          # envFrom is a separate field, so it cannot collide that way.
          envFrom:
            - secretRef:
                name: jobshout-com-auth
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-com-web
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
      name: http
  selector:
    {{- include "jobshout-com.selector" (dict "name" "web") | nindent 4 }}
