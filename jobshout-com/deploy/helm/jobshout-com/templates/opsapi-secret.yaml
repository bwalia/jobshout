{{- /*
OPSAPI_WEBHOOK_SECRET for the /hooks/opsapi receiver. The value is OpsAPI's
webhook secret, so it cannot be generated here: pass it once with
--set-string secrets.opsapiWebhookSecret=..., and later deploys keep it.
Empty means the receiver answers 503 (posts still refresh every 5 minutes).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "jobshout-com-opsapi" -}}
{{- $secret := .Values.secrets.opsapiWebhookSecret | default "" -}}
{{- if and (eq $secret "") $existing }}
  {{- $secret = index $existing.data "OPSAPI_WEBHOOK_SECRET" | default "" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-com-opsapi
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPSAPI_WEBHOOK_SECRET: {{ $secret | quote }}
