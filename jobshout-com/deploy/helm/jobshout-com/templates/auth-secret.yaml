{{- $existing := lookup "v1" "Secret" .Release.Namespace "jobshout-com-auth" -}}
{{- $secret := .Values.secrets.authSecret | default "" -}}
{{- if and (eq $secret "") $existing }}
  {{- $secret = index $existing.data "NEXTAUTH_SECRET" | b64dec -}}
{{- end -}}
{{- if eq $secret "" -}}
  {{- $secret = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-com-auth
  labels:
    {{- include "jobshout-com.labels" . | nindent 4 }}
type: Opaque
# Both names carry the same value: NextAuth v4 reads NEXTAUTH_SECRET, v5 reads
# AUTH_SECRET. Keeping them in the Secret lets the web Deployment pull them
# with envFrom instead of two `env` entries (see web.yaml).
stringData:
  NEXTAUTH_SECRET: {{ $secret | quote }}
  AUTH_SECRET: {{ $secret | quote }}
