env: acc
host: acc.jobshout.com

api:
  replicas: 1

web:
  replicas: 1
  apiURL: "http://jobshout-com-api.acc.svc.cluster.local:8088"

postgres:
  enabled: true
  storage: 20Gi

nebuladb:
  url: "http://nebuladb.acc.svc.cluster.local:8080"

# Social sign-in credentials: populate WSL Vault kv path
# jobshout-com/acc/oauth (keys listed under oauth in values.yaml).
vaultSecrets:
  - name: jobshout-com-oauth
    store: wslvault-backend
    key: jobshout-com/acc/oauth
