env: test
host: test.jobshout.com

api:
  replicas: 1

web:
  replicas: 1
  apiURL: "http://jobshout-com-api.test.svc.cluster.local:8088"

postgres:
  enabled: true
  storage: 10Gi

nebuladb:
  url: "http://nebuladb.test.svc.cluster.local:8080"

# Social sign-in credentials: populate WSL Vault kv path
# jobshout-com/test/oauth (keys listed under oauth in values.yaml).
vaultSecrets:
  - name: jobshout-com-oauth
    store: wslvault-backend
    key: jobshout-com/test/oauth
