env: acc
host: acc-jobshout.workstation.co.uk
logLevel: info

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3:latest"

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

web:
  replicas: 1
  publicApiURL: "https://acc-jobshout.workstation.co.uk/api"
  publicWsURL: "wss://acc-jobshout.workstation.co.uk/api"

pythonRuntime:
  replicas: 2

storage:
  postgres: 15Gi
