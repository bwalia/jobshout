env: acc
host: acc.jobshout.co.uk
logLevel: info

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3.1:8b"
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  mailModel: "muse-glimmer:latest"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  blogCoverImages: false
  # Article writer on qwen3.8, as proved on int (see values-int.yaml): 120m per
  # article, 45m per call, 16384-token window for prose. Research and the JSON
  # stages stay on ollamaModel.
  ollamaTimeout: "45m"
  blogProseModel: "qwen3.8:latest"
  blogMaxRuntime: "120m"
  blogProseNumCtx: 16384

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

web:
  replicas: 1
  publicApiURL: "https://acc.jobshout.co.uk/api"
  publicWsURL: "wss://acc.jobshout.co.uk/api"

pythonRuntime:
  replicas: 2

storage:
  postgres: 15Gi

# WAF Efficacy Lab — off in this ring. int is the proving ring: a run is watched
# end-to-end there before any other ring points the agent at live traffic.
#
# To enable here, all three parts are needed — baseURL alone leaves the client
# disabled, and so does the secret alone:
#   1. set enabled: true and a baseURL below
#   2. populate WSL Vault at jobshout/acc/wslproxy (WSLPROXY_API_TOKEN, …)
#   3. add jobshout-wslproxy to extraSecretRefs + vaultSecrets below
wafLab:
  enabled: false
  baseURL: ""

# Secrets layered after jobshout-secrets. Values in WSL Vault; ESO syncs via
# vaultSecrets. See docs/wsl-vault-secrets.md. Paths use jobshout/acc/<name>.
extraSecretRefs:
  - jobshout-core
  - jobshout-gateways

vaultSecrets:
  - name: jobshout-core
    store: wslvault-backend
    key: jobshout/acc/core
  - name: jobshout-gateways
    store: wslvault-backend
    key: jobshout/acc/gateways

insights:
  siteURL: "https://acc.jobshout.com"
