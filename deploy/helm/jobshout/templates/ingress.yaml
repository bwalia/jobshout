{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobshout-ingress
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range (prepend (.Values.hostAliases | default list) .Values.host) }}
    - host: {{ . }}
      http:
        paths:
          # Single backend: the wslproxy edge forwards the whole host to one
          # service, so the in-cluster nginx gateway (not the ingress) fans out
          # /api and /webhooks to the API and everything else to the web app.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobshout-nginx
                port:
                  number: 80
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.host }}
        {{- range .Values.hostAliases | default list }}
        - {{ . }}
        {{- end }}
      secretName: jobshout-tls
  {{- end }}
{{- end }}
