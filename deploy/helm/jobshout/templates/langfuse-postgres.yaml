{{- if .Values.langfuse.enabled }}
# Langfuse's own Postgres. Separate from the app's pgvector instance on
# purpose: Langfuse wants a plain-Postgres database it fully owns (its
# migrations, its lifecycle), and keeping it out of the app instance means the
# nightly pg_dump budget and the version-pinning rules there stay untouched.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "langfuse-postgres") | nindent 4 }}
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "langfuse-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "langfuse-postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.langfuse.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobshout-langfuse-secrets
                  key: LANGFUSE_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.langfuse.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "langfuse"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "langfuse"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.langfuse.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "langfuse-postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "jobshout.selector" (dict "name" "langfuse-postgres") | nindent 4 }}
{{- end }}
