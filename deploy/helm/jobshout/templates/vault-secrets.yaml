{{- /*
  One ExternalSecret per vaultSecrets entry: ESO copies every key under a
  Vault path into a Kubernetes Secret of the same name. List that name in
  extraSecretRefs too, so the API loads it. Independent of externalSecret
  (jobshout-secrets), which stays off on the k3s path.
*/}}
{{- range .Values.vaultSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "jobshout.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1m" | quote }}
  secretStoreRef:
    kind: {{ .storeKind | default "ClusterSecretStore" }}
    name: {{ required "vaultSecrets[].store is required" .store }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    # Keep the Secret if this entry is removed, so the API keeps its
    # credentials until someone deletes them on purpose.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "vaultSecrets[].key is required" .key }}
{{- end }}
