apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-web
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "web") | nindent 8 }}
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.web.publicApiURL | quote }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.web.publicWsURL | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-web
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "web") | nindent 4 }}
