apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: jobshout-config
            - secretRef:
                name: jobshout-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=$(DATABASE_SSLMODE)"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Liveness is deliberately a bare TCP check, not GET /health: the
          # health handler pings Postgres and returns 503 when the DB is
          # unreachable. Wiring that into liveness lets a DB outage kill every
          # API pod — which a restart cannot fix, so they crash-loop until the
          # DB returns. Readiness keeps the DB check, so pods still leave the
          # Service endpoints while degraded; they just stay alive to reconnect.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
