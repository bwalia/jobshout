apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.postgres.enabled }}
      # Wait for the in-cluster Postgres to accept connections before starting
      # the API. The API connects + runs migrations on boot, so without this it
      # crash-loops on a brand-new namespace until the DB is up — which trips a
      # deploy's post-rollout health check (e.g. Ring Promoter marking a fresh
      # ring unhealthy even though the deploy succeeds).
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p {{ .Values.postgres.port }}; do
                echo "waiting for postgres:{{ .Values.postgres.port }}…"; sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      {{- end }}
      containers:
        - name: api
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: jobshout-config
            - secretRef:
                name: jobshout-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=$(DATABASE_SSLMODE)"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
