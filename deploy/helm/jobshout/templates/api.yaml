apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.postgres.enabled }}
      # Wait for the in-cluster Postgres to accept connections before starting
      # the API. The API connects + runs migrations on boot, so without this it
      # crash-loops on a brand-new namespace until the DB is up — which trips a
      # deploy's post-rollout health check (e.g. Ring Promoter marking a fresh
      # ring unhealthy even though the deploy succeeds).
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.waitImage | default .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p {{ .Values.postgres.port }}; do
                echo "waiting for postgres:{{ .Values.postgres.port }}…"; sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      {{- end }}
      containers:
        - name: api
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: jobshout-config
            - secretRef:
                name: jobshout-secrets
            {{- /*
              Secrets this chart does NOT manage, layered last so their keys win
              over the placeholders in jobshout-secrets.

              This exists because the deploy has nowhere else to put a real
              credential: Ring Promoter helm-installs with externalSecret off
              (k3s1's Vault stores are not usable), and the chart is git-cloned
              from a PUBLIC repo, so a values file is not a place a token can
              live. Instead the secret is created on the cluster out of band and
              named here — the name is not sensitive, the value never enters git,
              and helm leaves it alone across redeploys.

              optional: true so a ring that has not created it still starts;
              the affected feature just stays disabled.
            */}}
            {{- range .Values.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
          env:
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=$(DATABASE_SSLMODE)"
            {{- if .Values.langfuse.enabled }}
            # LLM tracing for everything this process runs — the sidecar only
            # traces its own LangChain/LangGraph runs; the article writer, the
            # research agent, agent executions and chat all execute here. Same
            # three variables and same generated Secret the sidecar reads (see
            # python-runtime.yaml). Rendered only when the stack is enabled, so
            # a ring without it can still point tracing at an external Langfuse
            # purely via extraSecretRefs (LANGFUSE_HOST/_PUBLIC_KEY/_SECRET_KEY).
            - name: LANGFUSE_HOST
              value: "http://langfuse-web:3000"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-langfuse-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
            # Keeps int/test/acc/prod traces separable if rings ever share a
            # Langfuse project.
            - name: LANGFUSE_TRACING_ENVIRONMENT
              value: {{ .Values.langfuse.tracingEnvironment | default .Release.Namespace | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # The API retries its first Postgres connection for up to
          # DATABASE_CONNECT_TIMEOUT before exiting. The startup probe hands it
          # that whole window: liveness does not start until startup succeeds,
          # so a database that is slow to come back no longer gets the pod
          # killed while it is still legitimately retrying.
          startupProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          # Liveness is deliberately a bare TCP check, not GET /health: the
          # health handler pings Postgres and returns 503 when the DB is
          # unreachable. Wiring that into liveness lets a DB outage kill every
          # API pod — which a restart cannot fix, so they crash-loop until the
          # DB returns. Readiness keeps the DB check, so pods still leave the
          # Service endpoints while degraded; they just stay alive to reconnect.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jobshout-api
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "api") | nindent 4 }}
