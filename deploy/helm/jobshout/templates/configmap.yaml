apiVersion: v1
kind: ConfigMap
metadata:
  name: jobshout-config
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
data:
  # Must include the leading colon — the server passes this straight to
  # net.Listen, which needs ":8080" (a bare "8080" is "missing port in address").
  SERVER_PORT: ":8080"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.postgres.database | quote }}
  DATABASE_SSLMODE: "disable"
  DATABASE_CONNECT_TIMEOUT: {{ .Values.api.dbConnectTimeout | quote }}
  REDIS_URL: "redis://redis:6379"
  JWT_ISSUER: "jobshout"
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  LLM_PROVIDER: {{ .Values.ai.provider | quote }}
  AUTO_MODEL_SELECTION: {{ .Values.ai.autoModelSelection | quote }}
  OLLAMA_BASE_URL: {{ .Values.ai.ollamaBaseURL | quote }}
  OLLAMA_DEFAULT_MODEL: {{ .Values.ai.ollamaModel | quote }}
  OLLAMA_TIMEOUT: {{ .Values.ai.ollamaTimeout | default "10m" | quote }}
  OLLAMA_NUM_CTX: {{ .Values.ai.ollamaNumCtx | default 8192 | quote }}
  OPENAI_BASE_URL: {{ .Values.ai.openaiBaseURL | quote }}
  OPENAI_DEFAULT_MODEL: {{ .Values.ai.openaiModel | quote }}
  # Image generation. Like Ollama, the local image model runs OUTSIDE the
  # cluster — mflux needs Apple MLX and the nodes are amd64 Linux — so every
  # ring points at the one workstation service. An empty imageBaseURL disables
  # the local path; the server then falls back to OpenAI images if a key is set,
  # and to no image generation at all if not.
  IMAGE_PROVIDER: {{ .Values.ai.imageProvider | default "mflux" | quote }}
  IMAGE_BASE_URL: {{ .Values.ai.imageBaseURL | default "" | quote }}
  IMAGE_DEFAULT_MODEL: {{ .Values.ai.imageModel | default "z-image-turbo" | quote }}
  IMAGE_TIMEOUT: {{ .Values.ai.imageTimeout | default "10m" | quote }}
  IMAGE_OPENAI_MODEL: {{ .Values.ai.imageOpenaiModel | default "gpt-image-1" | quote }}
  # Whether every article run pays for a cover image. Off leaves generation
  # available on demand through the API and the generate_image tool.
  BLOG_COVER_IMAGES: {{ .Values.ai.blogCoverImages | default false | quote }}
  BLOG_ORPHAN_TIMEOUT: {{ .Values.ai.blogOrphanTimeout | default "45m" | quote }}
  BLOG_MAX_RUNTIME: {{ .Values.ai.blogMaxRuntime | default "25m" | quote }}
  MINIO_BUCKET_IMAGES: {{ .Values.ai.imageBucket | default "images" | quote }}
  PYTHON_SIDECAR_URL: "http://python-runtime:8001"
  # opsapi CMS — where the Article Writer files generated posts as drafts. The
  # token is a secret and lives in the Secret, not here.
  OPSAPI_BASE_URL: {{ .Values.cms.baseURL | quote }}
  OPSAPI_NAMESPACE: {{ .Values.cms.namespace | quote }}
  OPSAPI_TIMEOUT: {{ .Values.cms.timeout | default "30s" | quote }}
  BLOG_AUTHOR_NAME: {{ .Values.cms.authorName | default "JobShout Article Writer" | quote }}
  # Penetration testing. Empty baseURL disables the feature (same pattern as
  # IMAGE_BASE_URL). The scanner itself lives on the workstation.
  STRIX_ENABLED: {{ .Values.pentest.enabled | default false | quote }}
  STRIX_BASE_URL: {{ .Values.pentest.baseURL | default "" | quote }}
  STRIX_TIMEOUT: {{ .Values.pentest.timeout | default "60s" | quote }}
  STRIX_POLL_INTERVAL: {{ .Values.pentest.pollInterval | default "15s" | quote }}
  STRIX_MAX_RUNTIME: {{ .Values.pentest.maxRuntime | default "2h" | quote }}
  STRIX_TARGET_ALLOWLIST: {{ .Values.pentest.targetAllowlist | default "" | quote }}
  # In-cluster PR reviewer sidecar. Empty base URL disables the feature (same
  # pattern as STRIX_BASE_URL). The sidecar is ClusterIP-only; the API talks
  # to it with REVIEW_BOT_TOKEN from extraSecretRefs, not a workstation JWT.
  REVIEW_BOT_ENABLED: {{ .Values.reviewBot.enabled | default false | quote }}
  {{- if .Values.reviewBot.enabled }}
  REVIEW_BOT_BASE_URL: "http://jobshout-review-bot:{{ .Values.reviewBot.port }}"
  {{- else }}
  REVIEW_BOT_BASE_URL: ""
  {{- end }}
  REVIEW_BOT_TIMEOUT: {{ .Values.reviewBot.timeout | default "60s" | quote }}
  REVIEW_BOT_POLL_INTERVAL: {{ .Values.reviewBot.pollInterval | default "15s" | quote }}
  REVIEW_BOT_MAX_RUNTIME: {{ .Values.reviewBot.maxRuntime | default "40m" | quote }}
  REVIEW_BOT_ALLOWED_REPOS: {{ join "," (.Values.reviewBot.allowedRepos | default list) | quote }}
  # Public origin of this ring — OAuth return and Telegram links. Secrets for
  # Gmail (GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_TOKEN_KEY) live in an
  # extraSecretRefs secret, never here.
  FRONTEND_BASE_URL: {{ printf "https://%s" .Values.host | quote }}
  GMAIL_OAUTH_REDIRECT_URL: {{ printf "https://%s/api/v1/mail/connection/oauth/callback" .Values.host | quote }}
  MAIL_POLL_INTERVAL: {{ .Values.mail.pollInterval | default "5m" | quote }}
  MAIL_RECONCILE_INTERVAL: {{ .Values.mail.reconcileInterval | default "15s" | quote }}
