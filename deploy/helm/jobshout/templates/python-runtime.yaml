apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-runtime
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
spec:
  replicas: {{ .Values.pythonRuntime.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.pythonRuntime.port }}"
        prometheus.io/path: "/health"
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: python-runtime
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "python-sidecar") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.pythonRuntime.port }}
              name: http
          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OLLAMA_DEFAULT_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OPENAI_BASE_URL
            - name: OPENAI_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OPENAI_DEFAULT_MODEL
            - name: SIDECAR_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobshout-secrets
                  key: PYTHON_SIDECAR_SECRET
          resources:
            {{- toYaml .Values.pythonRuntime.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonRuntime.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonRuntime.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: python-runtime
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pythonRuntime.port }}
      targetPort: {{ .Values.pythonRuntime.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
