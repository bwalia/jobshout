apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-runtime
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
spec:
  replicas: {{ .Values.pythonRuntime.replicas }}
  selector:
    matchLabels:
      {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.pythonRuntime.port }}"
        prometheus.io/path: "/health"
    spec:
      {{- include "jobshout.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: python-runtime
          image: {{ include "jobshout.image" (dict "ctx" . "repo" "python-sidecar") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.pythonRuntime.port }}
              name: http
          # Same layering as the API: chart-managed secrets first, then the
          # operator-created extraSecretRefs so their keys win. This is how the
          # sidecar receives OLLAMA_JWT_SECRET — its OLLAMA_BASE_URL points at
          # the workstation gateway in every ring, and unsigned requests there
          # are rejected; before this the sidecar could not reach it at all.
          # (Explicit env: entries below still beat envFrom, so only keys not
          # listed there are operator-overridable.)
          envFrom:
            - secretRef:
                name: jobshout-secrets
            {{- range .Values.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OLLAMA_DEFAULT_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OPENAI_BASE_URL
            - name: OPENAI_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: jobshout-config
                  key: OPENAI_DEFAULT_MODEL
            - name: SIDECAR_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobshout-secrets
                  key: PYTHON_SIDECAR_SECRET
            {{- if .Values.langfuse.enabled }}
            # LLM tracing against this ring's langfuse stack, keyed by the same
            # generated Secret that langfuse-web's headless init provisions the
            # project with. Rendered only when the stack is enabled, so a ring
            # without it can still point tracing at an external Langfuse purely
            # via extraSecretRefs (LANGFUSE_HOST/_PUBLIC_KEY/_SECRET_KEY).
            - name: LANGFUSE_HOST
              value: "http://langfuse-web:3000"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-langfuse-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jobshout-langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.pythonRuntime.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonRuntime.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonRuntime.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: python-runtime
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pythonRuntime.port }}
      targetPort: {{ .Values.pythonRuntime.port }}
      name: http
  selector:
    {{- include "jobshout.selector" (dict "name" "python-runtime") | nindent 4 }}
