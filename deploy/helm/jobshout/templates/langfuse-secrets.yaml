{{- if .Values.langfuse.enabled }}
{{/*
Langfuse credentials, generated in-cluster on first deploy.

This repo is public and Ring Promoter deploys it with externalSecret.enabled=
false, so committed values here would be world-readable — and unlike the app's
jobshout-secrets, Langfuse cannot boot with empty ones (SALT and NEXTAUTH_SECRET
are mandatory) and its admin login sits on a public host. So every value is
minted with helm's lookup-or-generate pattern: the first real `helm upgrade`
against the cluster generates them, every later one finds the existing Secret
and carries the same values forward. (`helm template` without a cluster
regenerates randoms each render — harmless, nothing is applied.)

Read the admin login / API keys back with:
  kubectl -n <ring> get secret jobshout-langfuse-secrets -o yaml
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "jobshout-langfuse-secrets") }}
{{- $data := dict }}
{{- if $existing }}{{- $data = ($existing.data | default dict) }}{{- end }}
{{- $keep := dict }}
{{- range $key := list "SALT" "ENCRYPTION_KEY" "NEXTAUTH_SECRET" "CLICKHOUSE_PASSWORD" "REDIS_AUTH" "MINIO_ROOT_PASSWORD" "LANGFUSE_DB_PASSWORD" "LANGFUSE_INIT_USER_PASSWORD" "LANGFUSE_PUBLIC_KEY" "LANGFUSE_SECRET_KEY" }}
{{- if hasKey $data $key }}{{- $_ := set $keep $key (index $data $key | b64dec) }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-langfuse-secrets
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
type: Opaque
stringData:
  SALT: {{ $keep.SALT | default (randAlphaNum 32) | quote }}
  # Langfuse requires exactly 64 hex chars; sha256sum of a random string is that.
  ENCRYPTION_KEY: {{ $keep.ENCRYPTION_KEY | default (sha256sum (randAlphaNum 64)) | quote }}
  NEXTAUTH_SECRET: {{ $keep.NEXTAUTH_SECRET | default (randAlphaNum 32) | quote }}
  CLICKHOUSE_PASSWORD: {{ $keep.CLICKHOUSE_PASSWORD | default (randAlphaNum 24) | quote }}
  REDIS_AUTH: {{ $keep.REDIS_AUTH | default (randAlphaNum 24) | quote }}
  MINIO_ROOT_PASSWORD: {{ $keep.MINIO_ROOT_PASSWORD | default (randAlphaNum 24) | quote }}
  LANGFUSE_DB_PASSWORD: {{ $keep.LANGFUSE_DB_PASSWORD | default (randAlphaNum 24) | quote }}
  # First-boot admin (LANGFUSE_INIT_*): the UI login for this ring.
  LANGFUSE_INIT_USER_PASSWORD: {{ $keep.LANGFUSE_INIT_USER_PASSWORD | default (randAlphaNum 20) | quote }}
  # Project API keys, provisioned by Langfuse's headless init and consumed by
  # the python-sidecar (tracing) and the dashboard/model provisioning scripts.
  LANGFUSE_PUBLIC_KEY: {{ $keep.LANGFUSE_PUBLIC_KEY | default (printf "pk-lf-%s" (randAlphaNum 24 | lower)) | quote }}
  LANGFUSE_SECRET_KEY: {{ $keep.LANGFUSE_SECRET_KEY | default (printf "sk-lf-%s" (randAlphaNum 24 | lower)) | quote }}
{{- end }}
