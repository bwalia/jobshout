{{- if .Values.image.pullSecret }}
{{- if .Values.externalSecret.enabled }}
# Registry pull secret built from Vault creds (REGISTRY_USERNAME/PASSWORD at
# secret/jobshout/<env>/config). The inner {{`...`}} is left for ESO to render
# at sync time — Helm only substitutes .Values.image.registry.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret }}
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ .Values.image.pullSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .Values.image.registry }}":{"auth":"{{ `{{ printf "%s:%s" .REGISTRY_USERNAME .REGISTRY_PASSWORD | b64enc }}` }}"}}}'
  data:
    - secretKey: REGISTRY_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.vaultKeyPrefix }}/{{ .Values.env }}/{{ .Values.externalSecret.vaultKeySuffix }}
        property: REGISTRY_USERNAME
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.vaultKeyPrefix }}/{{ .Values.env }}/{{ .Values.externalSecret.vaultKeySuffix }}
        property: REGISTRY_PASSWORD
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecret }}
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" .Values.image.registry (printf "%s:%s" .Values.secrets.registryUsername .Values.secrets.registryPassword | b64enc) | b64enc }}
{{- end }}
{{- end }}
