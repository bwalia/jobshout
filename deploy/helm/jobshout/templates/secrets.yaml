{{- if .Values.externalSecret.enabled }}
# App secrets pulled from Vault (secret/jobshout/<env>/config) by the External
# Secrets Operator via the vault-backend ClusterSecretStore. Every key at that
# path is materialized into the jobshout-secrets Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jobshout-secrets
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: jobshout-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.vaultKeyPrefix }}/{{ .Values.env }}/{{ .Values.externalSecret.vaultKeySuffix }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- else }}
# Fallback plaintext Secret for local `helm template`/testing WITHOUT Vault.
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-secrets
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.secrets.databaseUser | default "jobshout" | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | default "dev-password" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "dev-jwt-secret" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  # Hosted Gemini. Empty skips Gemini. On k3s1 override via Vault path
  # jobshout/<ring>/gemini → jobshout-gemini (extraSecretRefs), not here.
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
  # Ollama gateway. Empty means unsigned. On k3s1: jobshout/<ring>/gateways.
  OLLAMA_JWT_SECRET: {{ .Values.secrets.ollamaJwtSecret | default "" | quote }}
  # Image gateway. Same scheme as OLLAMA_JWT_SECRET. On k3s1: gateways path.
  IMAGE_JWT_SECRET: {{ .Values.secrets.imageJwtSecret | default "" | quote }}
  # Strix gateway. Distinct from Ollama/image on purpose. On k3s1:
  # jobshout/<ring>/strix → jobshout-strix (never fold into gateways).
  STRIX_JWT_SECRET: {{ .Values.secrets.strixJwtSecret | default "" | quote }}
  # opsapi CMS key ("opsk_..."). Empty disables publishing. On k3s1:
  # jobshout/<ring>/cms → jobshout-cms (CMS-only keys in that path).
  OPSAPI_API_KEY: {{ .Values.secrets.opsapiApiKey | default "" | quote }}
  # On k3s1 override DATABASE_PASSWORD / JWT_SECRET / PYTHON_SIDECAR_SECRET
  # via jobshout/<ring>/core → jobshout-core (extraSecretRefs).
  PYTHON_SIDECAR_SECRET: {{ .Values.secrets.pythonSidecarSecret | default "dev-sidecar-secret" | quote }}
{{- end }}
