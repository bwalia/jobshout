{{- if .Values.externalSecret.enabled }}
# App secrets pulled from Vault (secret/jobshout/<env>/config) by the External
# Secrets Operator via the vault-backend ClusterSecretStore. Every key at that
# path is materialized into the jobshout-secrets Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jobshout-secrets
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: jobshout-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.vaultKeyPrefix }}/{{ .Values.env }}/{{ .Values.externalSecret.vaultKeySuffix }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- else }}
# Fallback plaintext Secret for local `helm template`/testing WITHOUT Vault.
apiVersion: v1
kind: Secret
metadata:
  name: jobshout-secrets
  labels:
    {{- include "jobshout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.secrets.databaseUser | default "jobshout" | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | default "dev-password" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "dev-jwt-secret" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  # Shared secret for the Ollama auth gateway. Empty means no gateway, and
  # requests to OLLAMA_BASE_URL go out unsigned. In Vault-backed environments
  # this comes from the ExternalSecret above instead of here.
  OLLAMA_JWT_SECRET: {{ .Values.secrets.ollamaJwtSecret | default "" | quote }}
  # Shared secret for the gateway fronting the image service. Same scheme and
  # same meaning as OLLAMA_JWT_SECRET: empty means no gateway and requests to
  # IMAGE_BASE_URL go out unsigned.
  IMAGE_JWT_SECRET: {{ .Values.secrets.imageJwtSecret | default "" | quote }}
  # Seed JWT for the opsapi CMS. Empty means publishing stays disabled and
  # articles are generate-only. The server exchanges this at /auth/refresh
  # before each expiry, so it only has to be reissued if the pod is down for
  # longer than opsapi's 7-day grace window. In Vault-backed environments it
  # comes from the ExternalSecret above instead of here.
  OPSAPI_TOKEN: {{ .Values.secrets.opsapiToken | default "" | quote }}
  PYTHON_SIDECAR_SECRET: {{ .Values.secrets.pythonSidecarSecret | default "dev-sidecar-secret" | quote }}
{{- end }}
