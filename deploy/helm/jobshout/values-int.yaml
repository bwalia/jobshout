env: int
host: int.jobshout.co.uk
logLevel: debug

image:
  tag: 89f91ac  # Pinned: working web image after jobshout-web build regression (beba970)

# Cluster-side secret holding OPSAPI_TOKEN (and any other real credential) for
# this ring. Only the name lives here; create it with:
#   kubectl -n int create secret generic jobshout-cms \
#     --from-literal=OPSAPI_TOKEN=<token> --dry-run=client -o yaml | kubectl apply -f -
extraSecretRefs:
  - jobshout-cms

# opsapi CMS — the Article Writer files generated articles there as drafts.
# The host and namespace slug are not secret; the token is, and comes from the
# jobshout-cms secret above. int-opsapi-ui.workstation.co.uk is the dashboard;
# this is the API behind it.
cms:
  baseURL: "https://int-opsapi.workstation.co.uk"
  namespace: "workstation"

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3:latest"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  # Off until images.workstation.co.uk is actually registered on the edge.
  # Leaving it on would have every article run reach for a cover, fail to
  # resolve the host, and file that failure into its trace — harmless, since a
  # run carries on and still produces a complete article, but it would fill int
  # with a recurring error that looks like a bug rather than a missing endpoint.
  # Turn this on once the host is live and generation has been tried by hand
  # through the Images page.
  blogCoverImages: false

api:
  replicas: 1

web:
  replicas: 1
  publicApiURL: "https://int.jobshout.co.uk/api"
  publicWsURL: "wss://int.jobshout.co.uk/api"

pythonRuntime:
  replicas: 1

storage:
  postgres: 10Gi

# Langfuse LLM observability — int is the proving ring; other rings stay off
# until promoted deliberately. The UI host needs its edge registration once:
# run the register-edge-vhost workflow with host=int-langfuse.jobshout.co.uk,
# server_spec=deploy/edge/wslproxy-server-langfuse-int.json,
# health_path=/auth/sign-in. Credentials are generated in-cluster on first
# deploy; read the admin login from the jobshout-langfuse-secrets Secret.
langfuse:
  enabled: true
  host: int-langfuse.jobshout.co.uk
