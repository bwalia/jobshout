env: int
host: int.jobshout.co.uk
logLevel: debug

# image.tag is injected by Ring Promoter (--set image.tag=<sha>). Do not pin a
# stale SHA here; a forgotten --set would roll int back to that commit.

# Cluster-side secrets layered onto the API after jobshout-secrets (last wins).
# Values live in WSL Vault (KV v2 under kv/); ESO syncs them via vaultSecrets
# below. Never commit credential values — only names and Vault paths.
#
# Populate each path in WSL Vault, then restart jobshout-api after the first
# sync (env is read at process start). See docs/wsl-vault-secrets.md.
extraSecretRefs:
  # DATABASE_PASSWORD / JWT_SECRET / PYTHON_SIDECAR_SECRET override Helm
  # placeholders in jobshout-secrets (which RP resets every deploy).
  - jobshout-core
  - jobshout-cms
  # BRAVE_SEARCH_API_KEY: general web search for the Research Agent. Without
  # it research searches Hacker News and arXiv only.
  - jobshout-research
  - jobshout-review
  - jobshout-mail
  - jobshout-google
  # LinkedIn Poster: LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET / LINKEDIN_TOKEN_KEY.
  # Without it the agent still drafts; connecting and posting stay disabled.
  - jobshout-linkedin
  # wafLab.baseURL below is set, but the client stays disabled until it also has
  # a token (or username+password) — those arrive only through this secret.
  - jobshout-wslproxy
  # Secrets Rotation: SECRETS_VAULT_ADDR / SECRETS_VAULT_TOKEN / RP_API_TOKEN
  # (and optional SECRETS_ROT_GITHUB_TOKEN).
  - jobshout-secretsrot
  # GEMINI_API_KEY: registers Gemini as an LLM provider (int's default, see
  # ai.provider) and as the first-choice image backend.
  - jobshout-gemini
  # Shared workstation gateway secrets: OLLAMA_JWT_SECRET and IMAGE_JWT_SECRET.
  # The chart renders jobshout-secrets with them empty, so without this the
  # image gateway (images.workstation.co.uk) refuses every cover request (403)
  # and articles publish without a featured image.
  - jobshout-gateways
  # STRIX_JWT_SECRET for the pentest gateway (strix.workstation.co.uk). Kept in
  # its own secret, not jobshout-gateways, on purpose: this fronts a vulnerability
  # scanner, and the code keeps its secret distinct from the Ollama/image ones
  # so leaking one does not hand over all three (server/internal/strix/config.go).
  # Must match the secret the strix edge vhost verifies.
  - jobshout-strix
  # OPENAI_API_KEY / CLAUDE_API_KEY (or ANTHROPIC_API_KEY) / GEMINI_API_KEY:
  # each key set registers that provider in the model picker. Models are
  # chosen with ai.*Model / ai.*Models (values.yaml), not here.
  - jobshout-llm
  # Marketing Manager: OPSAPI_MARKETING_API_KEY (scripts/opsapi-api-key.sh
  # with OPSAPI_KEY_PROFILE=marketing — never the CMS key),
  # OPSAPI_MARKETING_NAMESPACE, MARKETING_TEST_RECIPIENTS. No
  # MARKETING_LIVE_SEND here: int sends only from a workspace in OpsAPI test
  # mode (docs/marketing-manager.md).
  - jobshout-marketing

# ExternalSecrets → WSL Vault (ClusterSecretStore wslvault-backend). Each entry
# materialises every key under `key` into a Secret of the same `name`. Keys in
# Vault must match env names exactly (GEMINI_API_KEY, not geminiApiKey).
# cms must hold CMS-only keys (OPSAPI_API_KEY) — not gateway/Gemini overlays.
vaultSecrets:
  - name: jobshout-core
    store: wslvault-backend
    key: jobshout/int/core
  - name: jobshout-cms
    store: wslvault-backend
    key: jobshout/int/cms
  - name: jobshout-research
    store: wslvault-backend
    key: jobshout/int/research
  - name: jobshout-review
    store: wslvault-backend
    key: jobshout/int/review
  - name: jobshout-mail
    store: wslvault-backend
    key: jobshout/int/mail
  - name: jobshout-google
    store: wslvault-backend
    key: jobshout/int/google
  - name: jobshout-linkedin
    store: wslvault-backend
    key: jobshout/int/linkedin
  - name: jobshout-wslproxy
    store: wslvault-backend
    key: jobshout/int/wslproxy
  - name: jobshout-secretsrot
    store: wslvault-backend
    key: jobshout/int/secretsrot
  - name: jobshout-gemini
    store: wslvault-backend
    key: jobshout/int/gemini
  - name: jobshout-gateways
    store: wslvault-backend
    key: jobshout/int/gateways
  - name: jobshout-strix
    store: wslvault-backend
    key: jobshout/int/strix
  - name: jobshout-llm
    store: wslvault-backend
    key: jobshout/int/llm
  - name: jobshout-marketing
    store: wslvault-backend
    key: jobshout/int/marketing

# opsapi CMS — the Article Writer files generated articles there as drafts.
# The host and namespace slug are not secret; the API key is, and comes from
# the jobshout-cms secret above. int-opsapi-ui.workstation.co.uk is the
# dashboard; this is the API behind it.
cms:
  baseURL: "https://int-opsapi.workstation.co.uk"
  namespace: "workstation"
  # Every finished article lands in the dashboard as a draft without anyone
  # pressing Publish. Drafts only; going live is still done in the CMS.
  autoFile: true

ai:
  enabled: true
  # Gemini is int's default text provider: the Article Writer, Course
  # Generator, Research and every agent without a provider of its own use it.
  # Needs GEMINI_API_KEY from the jobshout-gemini secret above.
  provider: gemini
  geminiModel: "gemini-flash-latest"
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3.1:8b"
  # Chat stays on Ollama whatever ai.provider is (NewChatInner).
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  # Mail and Career keep their Ollama models, so they stay on Ollama.
  mailModel: "muse-glimmer:latest"
  mailProvider: ollama
  careerProvider: ollama
  # Shared workstation Ollama is CPU-heavy and often queued; research/draft
  # calls were dying at 10m with "awaiting headers". 45m because one draft on
  # the larger writing model below took 17–28m, and over 28m once.
  ollamaTimeout: "45m"
  # No blogProseModel here: it names a model on ai.provider, and int's writing
  # model is now Gemini's default (geminiModel). The qwen3.8 pin it held was an
  # Ollama model. Runtime stays generous while Gemini timings are measured.
  blogMaxRuntime: "120m"
  imageBaseURL: "https://images.workstation.co.uk"
  # Blog covers use z-image-turbo (dark editorial template, ~8 steps, ~1 min).
  imageModel: "z-image-turbo"
  imageTimeout: "30m"
  # On. images.workstation.co.uk is registered on the edge behind the JWT
  # gateway. int is the ring where a cover is worth watching before the rest
  # follow.
  blogCoverImages: true

# ai.provider stays gemini (chat and auto-selection still exercise it), but the
# heavy, long-running agents are pinned to Ollama: the shared Gemini free-tier
# key hits its quota under their load (HTTP 429 storms seen 5 Oct), which failed
# Article Writer and Research runs. The per-agent scheme (AGENT_PROVIDER__<BUILTIN>,
# added in #242) repoints them without disturbing the global default.
extraConfig:
  AGENT_PROVIDER__ARTICLE_WRITER: ollama
  AGENT_PROVIDER__JOBSHOUT_COM_WRITER: ollama
  AGENT_PROVIDER__RESEARCHER: ollama
  AGENT_PROVIDER__COURSE_GENERATOR: ollama

# Penetration testing against the workstation strix-service. int is the proving
# ring — other rings stay off until a scan has been watched end-to-end here,
# including an API-pod restart mid-scan. The host must be registered on the
# edge (see docs/pentest-agent.md) and STRIX_JWT_SECRET must match the gateway
# (Vault / extraSecretRefs), distinct from IMAGE_JWT_SECRET.
pentest:
  enabled: true
  baseURL: "https://strix.workstation.co.uk"
  timeout: "60s"
  pollInterval: "15s"
  maxRuntime: "2h"
  # Narrow: only the deliberately-vulnerable app you own. Empty refuses
  # nothing on the API side; scope.py on the workstation still defaults to deny.
  # Example once Juice Shop is up: "juice.local,127.0.0.1"
  targetAllowlist: ""

# WAF Efficacy Lab against lon1 wslproxy. Credentials via Vault path
# jobshout/int/wslproxy (WSLPROXY_API_TOKEN or WSLPROXY_USERNAME/PASSWORD);
# keep chart values empty of secrets.
wafLab:
  enabled: true
  baseURL: "https://lon1.pop0.uk"
  platform: "openresty-admin-next"
  profile: "prod"
  timeout: "30s"
  labMaxRuntime: "10m"
  targetAllowlist: ""

# int is the proving ring for PR review. Other rings stay off until a dry-run
# has been watched end-to-end here, including an API-pod restart mid-review.
reviewBot:
  enabled: true
  allowedRepos:
    - bwalia/jobshout
    - bwalia/diy-tax-return-uk
    - bwalia/diy-tax-return-infra
    - bwalia/opsapi
    - bwalia/ring-promoter
    - bwalia/wslproxy
  resources:
    requests: { cpu: 50m }

api:
  replicas: 1
  resources:
    # int pins every pod to debian004 (see nodeSelector), which is close to
    # fully requested. These pods idle at a few millicores; the chart's
    # default requests left no room for a rolling update's surge pod, so
    # every deploy timed out in helm --wait (2 Oct 2026). Limits unchanged.
    requests: { cpu: 50m }

web:
  replicas: 1
  publicApiURL: "https://int.jobshout.co.uk/api"
  publicWsURL: "wss://int.jobshout.co.uk/api"

pythonRuntime:
  replicas: 1
  resources:
    requests: { cpu: 50m }

storage:
  postgres: 10Gi

# Langfuse LLM observability — int is the proving ring; other rings stay off
# until promoted deliberately. The UI host needs its edge registration once:
# run the register-edge-vhost workflow with host=int-langfuse.jobshout.co.uk,
# server_spec=deploy/edge/wslproxy-server-langfuse-int.json,
# health_path=/auth/sign-in. Credentials are generated in-cluster on first
# deploy; read the admin login from the jobshout-langfuse-secrets Secret.
langfuse:
  enabled: true
  host: int-langfuse.jobshout.co.uk

# Secrets Rotation propagation on int. The kubeconfig in jobshout-secretsrot-kube
# (key "k3s1") belongs to ServiceAccount int/jobshout-secretsrot, whose Role only
# allows get/patch secrets + externalsecrets and get/list deployments in int.
# That Secret is still out-of-band (file mount); env credentials are Vault-backed.
secretsRotation:
  kubeconfig:
    enabled: true

# int's stateless pods landed on bwalia-latitude7300, a laptop that drops out of
# the cluster when it sleeps (26 Sep 2026: every int page returned 502). Keep
# them on a LAN worker with headroom.
nodeSelector:
  kubernetes.io/hostname: debian004

insights:
  siteURL: "https://int.jobshout.com"
