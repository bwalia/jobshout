# Base defaults for the JobShout Helm chart.
# Per-environment overrides live in values-<env>.yaml. The namespace is passed
# on the CLI (--namespace <env>), matching the cluster convention where peer
# apps deploy into the bare int/test/acc/prod namespaces with app-prefixed
# resource names.

env: int
# Public host per environment. jobshout.co.uk has no wildcard, so each host needs
# a Cloudflare CNAME -> pop0.wslproxy.com plus a wslproxy vhost -> the k3s Traefik
# edge (see .github/workflows/register-edge-vhost.yml).
host: int.jobshout.co.uk

image:
  # int-spectoncr.diytaxreturn.co.uk (via the pop1 edge) is reachable from the
  # jobshout self-hosted runner and from k3s1; spectoncr.workstation.co.uk (pop0)
  # is NOT reachable from this runner. Both front the same SpectonCR registry —
  # the NodePort's auth realm is int-spectoncr.diytaxreturn.co.uk.
  registry: int-spectoncr.diytaxreturn.co.uk
  namespace: jobshout
  # server / web / python-sidecar / review-bot images share this tag (git SHA),
  # injected at deploy time via --set image.tag=<sha>.
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret: jobshout-registry

# External Secrets Operator -> HashiCorp Vault (ClusterSecretStore vault-backend).
# All app secrets live at secret/jobshout/<env>/config and are materialized into
# a k8s Secret named jobshout-secrets. Registry creds share the same Vault path.
externalSecret:
  enabled: true
  refreshInterval: "1m"
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultKeyPrefix: secret/jobshout
  vaultKeySuffix: config

# Secrets that exist on the cluster but are NOT managed by this chart, layered
# onto the API's environment after jobshout-secrets so their keys win.
#
# Real credentials have nowhere else to go on the k3s path: Ring Promoter
# deploys with externalSecret.enabled=false, and it git-clones this chart from a
# public repo — so anything committed here is public. Create the secret on the
# cluster once and name it here:
#
#   kubectl -n <ring> create secret generic jobshout-cms \
#     --from-literal=OPSAPI_API_KEY=<key> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Missing secrets are tolerated (optional: true), so naming one before it exists
# does not break a deploy.
extraSecretRefs: []

# Fallback plaintext secrets, used ONLY when externalSecret.enabled=false.
# On k3s1 that is every deploy, so these stay as placeholders: a real value
# committed here would be public. Anything genuinely secret belongs in an
# extraSecretRefs secret instead.
secrets:
  databaseUser: jobshout
  databasePassword: ""
  jwtSecret: ""
  openaiApiKey: ""
  # Set via --set-string or Vault; never committed here.
  ollamaJwtSecret: ""
  # Gateway secret for strix-service. Distinct from ollama/image on purpose.
  strixJwtSecret: ""
  imageJwtSecret: ""
  opsapiApiKey: ""
  pythonSidecarSecret: ""
  registryUsername: ""
  registryPassword: ""

# opsapi CMS — the Article Writer files generated posts there as drafts. All of
# baseURL, namespace and secrets.opsapiApiKey must be set before the Publish
# action appears; empty leaves the agent generate-only, which is the default so
# a deploy cannot accidentally start writing into someone else's namespace.
cms:
  baseURL: ""
  namespace: ""
  timeout: "30s"
  authorName: "JobShout Article Writer"

# In-cluster nginx gateway. The wslproxy edge routes the whole host to a single
# backend, so the ingress points at this gateway and nginx fans traffic out by
# path (/api + /webhooks -> API, everything else -> web), same as beaconpulse.
gateway:
  enabled: true
  image: nginx:1.27-alpine
  resolver: "10.43.0.10"   # k3s cluster DNS (kube-dns ClusterIP)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }

ingress:
  enabled: true
  className: wslproxy
  clusterIssuer: main-issuer
  tls: true
  annotations: {}

# Ollama runs OUTSIDE the cluster; reached via the shared platform endpoint
# ollama.workstation.co.uk (same one beaconpulse uses), which is routable from
# k3s1 pods — unlike a LAN IP, which is not.
ai:
  enabled: true
  provider: ollama
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3:latest"
  # Bounds one Ollama call end-to-end. Article drafts are streamed but still
  # take minutes on the shared CPU host (cold load + queue + 900–1400 words).
  ollamaTimeout: "30m"
  # Context window requested per call. Without num_ctx, Ollama applies its own
  # server-side default and silently truncates a long prompt rather than
  # refusing it — so it is always sent. Raise this to let agents use the larger
  # windows big models support; model discovery caps it per model, so a value
  # above what a model can hold is lowered rather than rejected.
  ollamaNumCtx: 8192
  openaiBaseURL: "https://api.openai.com"
  openaiModel: "gpt-4o-mini"
  # Per-task model selection. When true, an agent whose modelProvider is "auto"
  # gets a provider+model chosen per call — cheap local models for routine work,
  # stronger ones for planning and code. Agents pinned to a provider are
  # unaffected; setting this false just makes "auto" fall back to the default.
  autoModelSelection: true

  # Image generation. mflux runs on Apple MLX, which needs a Metal GPU, so
  # unlike everything else in this chart the image model CANNOT be scheduled
  # onto the cluster — the k3s1 nodes are amd64 Linux. It runs on the
  # workstation (see image-service/ in this repository) and every ring reaches
  # that one instance, exactly as every ring reaches one Ollama.
  #
  # imageBaseURL is empty by default so a deploy that has not stood the service
  # up does not spend a timeout discovering that. Set it per ring, or here once
  # the workstation host is registered on the edge.
  imageProvider: mflux
  imageBaseURL: ""
  imageModel: "z-image-turbo"
  # Covers at 1536×864 / 28 steps need headroom past a cold qwen load.
  imageTimeout: "30m"
  imageOpenaiModel: "gpt-image-1"
  imageBucket: "images"
  # Off by default: a cover costs roughly 25 seconds of a single shared GPU per
  # article, and that is a cost an operator should choose to pay. Image
  # generation stays available on demand either way.
  blogCoverImages: false
  # How long a running row may sit without a heartbeat before the reconciler
  # marks it failed. Must outlast a legitimate long LLM call. Max runtime is
  # a wall-clock cap on the generation goroutine, kept below ollamaTimeout.
  blogOrphanTimeout: "45m"
  blogMaxRuntime: "25m"

# Penetration testing. Strix runs on the workstation (needs a real Docker
# daemon — a k3s pod has none, and privileged DinD is not an acceptable trade).
# Same shape as image generation: one service on the Mac, every ring reaches it
# over a JWT-gated public endpoint. Off by default — empty baseURL means the
# feature is disabled without spending a timeout discovering that.
pentest:
  enabled: false
  baseURL: ""
  # Bounds one HTTP call (start/status/cancel), not one scan.
  timeout: "60s"
  pollInterval: "15s"
  maxRuntime: "2h"
  # Defence in depth. scope.py on the workstation is the real boundary.
  # Comma-separated hosts, wildcards, CIDRs or URL prefixes.
  targetAllowlist: ""

# Mail Agent — one shared org Gmail. OAuth client id/secret and GMAIL_TOKEN_KEY
# are secrets (extraSecretRefs), not chart values. Empty client id leaves Connect
# disabled; the builtin agent still seeds.
#
#   kubectl -n <ring> create secret generic jobshout-mail \
#     --from-literal=GMAIL_CLIENT_ID=<google-oauth-client-id> \
#     --from-literal=GMAIL_CLIENT_SECRET=<google-oauth-client-secret> \
#     --from-literal=GMAIL_TOKEN_KEY=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
mail:
  pollInterval: "5m"
  reconcileInterval: "15s"

# In-cluster PR reviewer (OpenCode + git clones in the pod; Ollama on the Mac
# via ollama.workstation.co.uk). Off by default — int opts in. No public URL:
# the API reaches it at http://jobshout-review-bot:8765. Create the operator
# secret once per ring that enables this:
#
#   kubectl -n <ring> create secret generic jobshout-review \
#     --from-literal=GITHUB_TOKEN=<repo-scope-bot> \
#     --from-literal=REVIEW_BOT_TOKEN=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# and name it in extraSecretRefs. The sidecar also needs OLLAMA_JWT_SECRET from
# jobshout-secrets (same gateway as articles).
reviewBot:
  enabled: false
  port: 8765
  # MCP (Streamable HTTP) port, served by the same pod/process as the REST API.
  # nginx exposes this at /mcp; the REST port stays cluster-internal.
  mcpPort: 8766
  model: "qwen3-coder:30b"
  ollamaHost: "https://ollama.workstation.co.uk"
  timeout: "60s"
  pollInterval: "15s"
  maxRuntime: "40m"
  storage: 20Gi
  allowedRepos: []
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

logLevel: info

storage:
  className: local-path
  postgres: 10Gi

api:
  replicas: 1
  port: 8080
  # Three budgets that must nest, innermost first:
  #
  #   dbConnectTimeout (180s) < startup probe (240s) < helm --wait (300s)
  #
  # The API retries its initial Postgres connection for dbConnectTimeout. The
  # startup probe must outlast that, or Kubernetes kills the pod while it is
  # still legitimately retrying. And the whole rollout must finish inside the
  # `helm upgrade --wait --timeout 5m` that Ring Promoter runs, or helm gives up
  # and records the release as failed even though the pods go on to converge.
  # An earlier 400s probe budget overran that window and left int marked failed
  # while it was in fact perfectly healthy.
  #
  # Set dbConnectTimeout to 0 to fail fast on the first error.
  dbConnectTimeout: 3m
  startupProbe:
    periodSeconds: 10
    failureThreshold: 24 # 240s
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

web:
  replicas: 1
  port: 3001
  # Public base URL the browser uses to reach the API (through the ingress).
  publicApiURL: "https://int.jobshout.co.uk/api"
  publicWsURL: "wss://int.jobshout.co.uk/api"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

pythonRuntime:
  replicas: 1
  port: 8001
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

postgres:
  enabled: true
  port: 5432
  database: jobshout
  # Shared by the StatefulSet, the API's wait-for-postgres initContainer, and
  # the backup CronJob. pg_dump refuses to run against a server newer than
  # itself, so all of them must move together.
  #
  # pgvector, not plain postgres: migration 000016 opens with CREATE EXTENSION
  # vector, and stock postgres images do not ship it — the extension is not
  # merely absent from the database, it is unavailable to install, so the API
  # fatals during migrations and never serves. Same PostgreSQL 16.14 underneath.
  image: pgvector/pgvector:pg16
  # The API's wait-for-postgres initContainer only calls pg_isready, so it does
  # not need the vector extension — and pulling the full pgvector image for it
  # is what makes a rollout onto a node that has not cached it take ten-plus
  # minutes, past the deploy's helm --wait timeout. Postgres lands on one node
  # and the API on another, so that pull is the normal case, not the rare one.
  # Any image carrying pg_isready of a compatible version will do; the alpine
  # postgres is an order of magnitude smaller.
  waitImage: postgres:16-alpine
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# Nightly pg_dump. Restores are manual — this only guarantees a dump exists.
#
# NOTE: backups land on a local-path PVC, which pins them to one node's disk,
# the same class of failure that can take out the database itself. This is a
# floor, not a backup strategy; shipping the dumps off-cluster (MinIO/S3) is
# the follow-up.
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 14
  size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  enabled: true
  port: 6379
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── Langfuse LLM observability ───────────────────────────────────────────────
# Traces every LLM call the python-sidecar makes: prompts, completions, tokens,
# latency, cost, per agent and per execution. See docs/langfuse.md.
#
# Off by default and enabled per ring (values-<env>.yaml), because it brings a
# real stack with it: langfuse web + worker, ClickHouse, and its own Postgres,
# Redis and MinIO. Its Redis must be separate from the app one — Langfuse runs
# BullMQ queues that require noeviction, while the app redis is an allkeys-lru
# cache; sharing would silently drop queued trace events. Postgres is separate
# because Langfuse wants a plain-Postgres database of its own, and MinIO exists
# only here because nothing else in the cluster needs S3.
#
# Every credential (SALT, encryption key, ClickHouse/Redis/MinIO passwords, the
# admin login, the project API keys) is generated in-cluster on first deploy
# and persisted in the jobshout-langfuse-secrets Secret — this repo is public,
# so nothing secret is committed, and there is no manual bootstrap step. Read
# the admin login with:
#
#   kubectl -n <ring> get secret jobshout-langfuse-secrets \
#     -o jsonpath='{.data.LANGFUSE_INIT_USER_PASSWORD}' | base64 -d
#
# The python-sidecar picks the project API keys out of the same Secret, so
# tracing turns on ring-wide the moment this is enabled. When disabled, the
# sidecar's key refs are optional and tracing stays off — behaviour unchanged.
langfuse:
  enabled: false
  # Public host for the Langfuse UI. Like .host it needs a Cloudflare CNAME and
  # a wslproxy vhost (deploy/edge/wslproxy-server-langfuse-<env>.json) — run the
  # register-edge-vhost workflow with health_path=/auth/sign-in.
  host: ""
  # Value of the Langfuse "environment" dimension stamped on every span this
  # ring emits. Defaults to the release namespace (int/test/acc/prod), which is
  # what keeps rings separable if they ever share one Langfuse project.
  tracingEnvironment: ""
  webImage: langfuse/langfuse:4
  workerImage: langfuse/langfuse-worker:4
  web:
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "1", memory: 1536Mi }
  worker:
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1536Mi }
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    storage: 8Gi
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { cpu: "1", memory: 2Gi }
  postgres:
    image: postgres:16-alpine
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  redis:
    image: redis:7-alpine
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 384Mi }
  minio:
    image: minio/minio:latest
    storage: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 512Mi }
