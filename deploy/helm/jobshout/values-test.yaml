env: test
host: test.jobshout.co.uk
logLevel: info

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3.1:8b"
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  mailModel: "muse-glimmer:latest"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  blogCoverImages: false

api:
  replicas: 1

web:
  replicas: 1
  publicApiURL: "https://test.jobshout.co.uk/api"
  publicWsURL: "wss://test.jobshout.co.uk/api"

pythonRuntime:
  replicas: 1

storage:
  postgres: 10Gi

# WAF Efficacy Lab — off in this ring. int is the proving ring: a run is watched
# end-to-end there before any other ring points the agent at live traffic.
#
# To enable here, all three parts are needed — baseURL alone leaves the client
# disabled, and so does the secret alone:
#   1. set enabled: true and a baseURL below
#   2. kubectl -n test create secret generic jobshout-wslproxy \
#        --from-literal=WSLPROXY_API_TOKEN=<token>
#   3. add an extraSecretRefs list to this file naming jobshout-wslproxy
#      (this ring has none yet, so it inherits the empty default)
wafLab:
  enabled: false
  baseURL: ""

# Secrets Rotation propagation on test. jobshout-secretsrot holds
# SECRETS_VAULT_ADDR/SECRETS_VAULT_TOKEN and RP_API_TOKEN; the kubeconfig in
# jobshout-secretsrot-kube (key "k3s1") belongs to ServiceAccount
# test/jobshout-secretsrot, whose Role only allows get/patch secrets +
# externalsecrets and get/list deployments in test. Both are created by hand on
# k3s1, never in git, and must exist before this deploys.
extraSecretRefs:
  - jobshout-secretsrot
secretsRotation:
  kubeconfig:
    enabled: true
