env: test
host: test.jobshout.co.uk
logLevel: info

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3.1:8b"
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  mailModel: "muse-glimmer:latest"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  blogCoverImages: true
  # Article writer on qwen3.8, as proved on int (see values-int.yaml): 120m per
  # article, 45m per call, 16384-token window for prose. Research and the JSON
  # stages stay on ollamaModel.
  ollamaTimeout: "45m"
  blogProseModel: "qwen3.8:latest"
  blogMaxRuntime: "120m"
  blogProseNumCtx: 16384

api:
  replicas: 1

web:
  replicas: 1
  publicApiURL: "https://test.jobshout.co.uk/api"
  publicWsURL: "wss://test.jobshout.co.uk/api"

pythonRuntime:
  replicas: 1

storage:
  postgres: 10Gi

# WAF Efficacy Lab — off in this ring. int is the proving ring: a run is watched
# end-to-end there before any other ring points the agent at live traffic.
#
# To enable here, all three parts are needed — baseURL alone leaves the client
# disabled, and so does the secret alone:
#   1. set enabled: true and a baseURL below
#   2. populate WSL Vault at jobshout/test/wslproxy (WSLPROXY_API_TOKEN, …)
#   3. add jobshout-wslproxy to extraSecretRefs + vaultSecrets below
wafLab:
  enabled: false
  baseURL: ""

# Secrets layered after jobshout-secrets. Values in WSL Vault; ESO syncs via
# vaultSecrets. See docs/wsl-vault-secrets.md. Paths use jobshout/test/<name>.
extraSecretRefs:
  - jobshout-core
  - jobshout-secretsrot
  - jobshout-gateways
  # OPENAI_API_KEY / CLAUDE_API_KEY (or ANTHROPIC_API_KEY) / GEMINI_API_KEY:
  # each key set registers that provider in the model picker. Models are
  # chosen with ai.*Model / ai.*Models (values.yaml), not here.
  - jobshout-llm

vaultSecrets:
  - name: jobshout-core
    store: wslvault-backend
    key: jobshout/test/core
  - name: jobshout-secretsrot
    store: wslvault-backend
    key: jobshout/test/secretsrot
  - name: jobshout-gateways
    store: wslvault-backend
    key: jobshout/test/gateways
  - name: jobshout-llm
    store: wslvault-backend
    key: jobshout/test/llm

# Secrets Rotation propagation on test. jobshout-secretsrot holds
# SECRETS_VAULT_ADDR/SECRETS_VAULT_TOKEN and RP_API_TOKEN (Vault path above).
# The kubeconfig in jobshout-secretsrot-kube (key "k3s1") belongs to
# ServiceAccount test/jobshout-secretsrot and remains out-of-band (file mount).
secretsRotation:
  kubeconfig:
    enabled: true

insights:
  siteURL: "https://test.jobshout.com"
