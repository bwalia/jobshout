env: prod
host: jobshout.co.uk
logLevel: info

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3:latest"
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  blogCoverImages: false

api:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

web:
  replicas: 2
  publicApiURL: "https://jobshout.co.uk/api"
  publicWsURL: "wss://jobshout.co.uk/api"

pythonRuntime:
  replicas: 2
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

storage:
  postgres: 20Gi

# WAF Efficacy Lab — off in this ring. int is the proving ring: a run is watched
# end-to-end there before any other ring points the agent at live traffic.
#
# To enable here, all three parts are needed — baseURL alone leaves the client
# disabled, and so does the secret alone:
#   1. set enabled: true and a baseURL below
#   2. kubectl -n prod create secret generic jobshout-wslproxy \
#        --from-literal=WSLPROXY_API_TOKEN=<token>
#   3. add an extraSecretRefs list to this file naming jobshout-wslproxy
#      (this ring has none yet, so it inherits the empty default)
wafLab:
  enabled: false
  baseURL: ""
