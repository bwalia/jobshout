env: prod
host: jobshout.co.uk
# www is a separate Cloudflare CNAME + wslproxy vhost; same Traefik backend.
hostAliases:
  - www.jobshout.co.uk
logLevel: info

# Google sign-in returns via www: that callback is the one registered on the
# shared OAuth client. Login state is server-side, so apex starts still work.
googleAuth:
  callbackHost: www.jobshout.co.uk

ai:
  enabled: true
  ollamaBaseURL: "https://ollama.workstation.co.uk"
  ollamaModel: "llama3.1:8b"
  chatModel: "qwen3-coder:30b"
  chatModelFallback: "llama3.1:8b"
  imageBaseURL: "https://images.workstation.co.uk"
  imageModel: "z-image-turbo"
  # Unique listing covers per article. Without this, OpsAPI posts ship with no
  # featured_image_url and workstation.co.uk falls back to the same hero image
  # for every card.
  blogCoverImages: true
  # Article writer on qwen3.8, as proved on int (see values-int.yaml): 120m per
  # article, 45m per call, 16384-token window for prose. Research and the JSON
  # stages stay on ollamaModel.
  ollamaTimeout: "45m"
  blogProseModel: "qwen3.8:latest"
  blogMaxRuntime: "120m"
  blogProseNumCtx: 16384

api:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

web:
  replicas: 2
  publicApiURL: "https://jobshout.co.uk/api"
  publicWsURL: "wss://jobshout.co.uk/api"

pythonRuntime:
  replicas: 2
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

storage:
  postgres: 20Gi

# WAF Efficacy Lab — off in this ring. int is the proving ring: a run is watched
# end-to-end there before any other ring points the agent at live traffic.
#
# To enable here, all three parts are needed — baseURL alone leaves the client
# disabled, and so does the secret alone:
#   1. set enabled: true and a baseURL below
#   2. populate WSL Vault at jobshout/prod/wslproxy (WSLPROXY_API_TOKEN, …)
#   3. add jobshout-wslproxy to extraSecretRefs + vaultSecrets below
wafLab:
  enabled: false
  baseURL: ""

# Secrets layered after jobshout-secrets. Values in WSL Vault; ESO syncs via
# vaultSecrets. See docs/wsl-vault-secrets.md. Paths use jobshout/prod/<name>.
#
# jobshout-google: "Continue with Google" on /login and /signup
# (GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET). The OAuth client must
# list https://www.jobshout.co.uk/api/v1/auth/google/callback as a redirect URI
# (googleAuth.callbackHost; the apex URI was never accepted by Google).
# Refs are optional, so until the Vault path is populated the button stays hidden.
#
# jobshout-cms: OPSAPI_API_KEY for the Workstation CMS below (CMS-only keys).
# Minted with scripts/opsapi-api-key.sh against https://opsapi.workstation.co.uk
# (namespace workstation, scope cms create/update/read). Optional until Vault
# is filled — Article Writer writes but files nothing.
extraSecretRefs:
  - jobshout-core
  - jobshout-gateways
  - jobshout-google
  - jobshout-cms

vaultSecrets:
  - name: jobshout-core
    store: wslvault-backend
    key: jobshout/prod/core
  - name: jobshout-gateways
    store: wslvault-backend
    key: jobshout/prod/gateways
  - name: jobshout-google
    store: wslvault-backend
    key: jobshout/prod/google
  - name: jobshout-cms
    store: wslvault-backend
    key: jobshout/prod/cms

# Workstation CMS — articles reach www.workstation.co.uk through it, as int's
# reach int.workstation.co.uk through int-opsapi. Drafts only: going live is
# done in the CMS (opsapi-ui.workstation.co.uk). A writer agent with a website
# of its own (Writer settings → Website) files there instead.
cms:
  baseURL: "https://opsapi.workstation.co.uk"
  namespace: "workstation"
  autoFile: true

insights:
  siteURL: "https://www.jobshout.com"
