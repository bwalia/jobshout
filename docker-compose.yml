services:
  postgres:
    # pgvector, not plain postgres: migration 000016 opens with CREATE EXTENSION
    # vector, which stock postgres images cannot install. Keep this in step with
    # postgres.image in deploy/helm/jobshout/values.yaml.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobshout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobshout}
      POSTGRES_DB: ${POSTGRES_DB:-jobshout}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobshout}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9110}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE: no embedded `ollama` service — we point at the host's Ollama
  # (reachable from containers via host.docker.internal or HOST_IP:11434),
  # which already has qwen2.5-coder, llama3.x, etc. pulled. Keeping a
  # compose-managed Ollama meant every deploy started with zero models.

  python-sidecar:
    build:
      context: ./python-sidecar
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3:latest}
      # Same gateway signing secret the Go server uses (see gatewayauth). Empty
      # means "no gateway": requests to Ollama go out unsigned.
      OLLAMA_JWT_SECRET: ${OLLAMA_JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      SIDECAR_SECRET: ${PYTHON_SIDECAR_SECRET:-change-me-sidecar-secret}
      LOG_LEVEL: ${SIDECAR_LOG_LEVEL:-info}
      # LLM tracing. Off unless both keys are set in .env — copy them from the
      # langfuse profile's LANGFUSE_INIT_* defaults. See docs/langfuse.md.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  jobshout-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://jobshout:jobshout@postgres:5432/jobshout?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-character-string}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
      MINIO_BUCKET_KNOWLEDGE: ${MINIO_BUCKET_KNOWLEDGE:-knowledge}
      SERVER_PORT: ${SERVER_PORT:-:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # Point at the host's Ollama (qwen2.5-coder, llama3.x pre-loaded), or at
      # the shared auth gateway by setting OLLAMA_BASE_URL + OLLAMA_JWT_SECRET
      # in .env. Empty secret = no gateway, requests go out unsigned.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3:latest}
      OLLAMA_JWT_SECRET: ${OLLAMA_JWT_SECRET:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-10m}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHON_SIDECAR_URL: ${PYTHON_SIDECAR_URL:-http://python-sidecar:8001}
      PYTHON_SIDECAR_SECRET: ${PYTHON_SIDECAR_SECRET:-change-me-sidecar-secret}
      # Same keys as the sidecar: this process traces every LLM call it makes
      # (article writing, research, executor, chat) plus a per-execution
      # rollup for the go-native engine. Empty keys leave tracing off.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local}
      # Automated blog generator. Writing always works; publishing to the
      # opsapi CMS needs all three OPSAPI_* values, and is disabled without them.
      OPSAPI_BASE_URL: ${OPSAPI_BASE_URL:-}
      OPSAPI_API_KEY: ${OPSAPI_API_KEY:-}
      OPSAPI_NAMESPACE: ${OPSAPI_NAMESPACE:-}
      OPSAPI_TIMEOUT: ${OPSAPI_TIMEOUT:-30s}
      BLOG_AUTHOR_NAME: ${BLOG_AUTHOR_NAME:-JobShout Article Writer}
      BLOG_CONTENT_DIR: ${BLOG_CONTENT_DIR:-content/blogs}
      BLOG_ORPHAN_TIMEOUT: ${BLOG_ORPHAN_TIMEOUT:-45m}
      BLOG_MAX_RUNTIME: ${BLOG_MAX_RUNTIME:-25m}
      # Image generation on the workstation (port 11435). Empty URL disables it.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mflux}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://host.docker.internal:11435}
      IMAGE_JWT_SECRET: ${IMAGE_JWT_SECRET:-}
      IMAGE_DEFAULT_MODEL: ${IMAGE_DEFAULT_MODEL:-z-image-turbo}
      IMAGE_TIMEOUT: ${IMAGE_TIMEOUT:-30m}
      # Pentest: workstation strix-service on 11436. Empty URL disables it.
      STRIX_ENABLED: ${STRIX_ENABLED:-true}
      STRIX_BASE_URL: ${STRIX_BASE_URL:-http://host.docker.internal:11436}
      STRIX_JWT_SECRET: ${STRIX_JWT_SECRET:-}
      STRIX_TIMEOUT: ${STRIX_TIMEOUT:-60s}
      STRIX_POLL_INTERVAL: ${STRIX_POLL_INTERVAL:-15s}
      STRIX_MAX_RUNTIME: ${STRIX_MAX_RUNTIME:-2h}
      STRIX_TARGET_ALLOWLIST: ${STRIX_TARGET_ALLOWLIST:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_ENV: ${APP_ENV:-local}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_TOKEN_KEY: ${GMAIL_TOKEN_KEY:-}
      GMAIL_OAUTH_REDIRECT_URL: ${GMAIL_OAUTH_REDIRECT_URL:-http://localhost:8190/api/v1/mail/connection/oauth/callback}
      MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-5m}
      MAIL_RECONCILE_INTERVAL: ${MAIL_RECONCILE_INTERVAL:-15s}
    ports:
      - "${SERVER_HOST_PORT:-8190}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      python-sidecar:
        condition: service_healthy

  jobshout-ui:
    build:
      context: ./web/nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8190}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8190}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8190}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8190}
    ports:
      - "${UI_HOST_PORT:-3001}:3001"
    depends_on:
      - jobshout-server

  # ─── Langfuse LLM observability (opt-in) ───────────────────────────────────
  # Started only with `docker compose --profile langfuse up`, so the default
  # stack stays as light as it is today. Langfuse v3+ needs ClickHouse, Redis,
  # Postgres and an S3 store; it gets its own Postgres (the app one is pgvector
  # with a single database) and reuses the app MinIO with a dedicated bucket.
  # First boot self-provisions the org/project/user/API keys below via
  # LANGFUSE_INIT_* — see docs/langfuse.md. All secrets are dev defaults;
  # override them in .env for anything shared.
  langfuse-postgres:
    profiles: ["langfuse"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    profiles: ["langfuse"]
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-redis:
    profiles: ["langfuse"]
    image: redis:7
    # noeviction because Langfuse runs BullMQ queues in here — evicting a queue
    # entry under memory pressure silently loses ingested events.
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-langfuse-redis-secret}
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_AUTH:-langfuse-redis-secret} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the langfuse bucket in the shared app MinIO, then exits.
  langfuse-minio-init:
    profiles: ["langfuse"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${LANGFUSE_S3_BUCKET:-langfuse}
      "

  langfuse-worker:
    profiles: ["langfuse"]
    image: langfuse/langfuse-worker:4
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3002}
      SALT: ${LANGFUSE_SALT:-jobshout-local-salt}
      # Must be exactly 64 hex chars (openssl rand -hex 32). Dev default only.
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-2f9c1e4b8a7d6c5f3e2d1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-langfuse-redis-secret}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  langfuse-web:
    profiles: ["langfuse"]
    image: langfuse/langfuse:4
    depends_on: *langfuse-depends-on
    ports:
      - "${LANGFUSE_HOST_PORT:-3002}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-jobshout-local-nextauth-secret}
      # Media presigned URLs are fetched by the browser, so the web container
      # must hand out the host-reachable MinIO address, not the in-network one.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${MINIO_API_HOST_PORT:-9100}
      # Headless first-boot provisioning: org → project → API keys + admin
      # user. Runs only when these resources don't already exist. Values are
      # deliberately unquoted — Langfuse docs warn quoting breaks them.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-jobshout}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-JobShout}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-jobshout}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-JobShout}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-jobshout-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-jobshout-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@jobshout.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-JobShout Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-jobshout-langfuse}

volumes:
  postgres_data:
  minio_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
