name: Deploy JobShout

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-jobshout
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy docker-compose stack
    runs-on: [self-hosted, int]

    env:
      # DEPLOY_DIR and HOST_IP are resolved at runtime by the "Resolve host
      # config" step below so this workflow is portable across runners (the
      # self-hosted macOS runner has no /home and a DHCP-assigned LAN IP).
      # Host port mappings — chosen to avoid conflicts on the runner VM.
      UI_HOST_PORT: "3001"
      SERVER_HOST_PORT: "8190"
      POSTGRES_HOST_PORT: "5433"
      MINIO_API_HOST_PORT: "9100"
      MINIO_CONSOLE_HOST_PORT: "9110"
      # No OLLAMA_HOST_PORT — compose no longer runs Ollama; we use the
      # host's Ollama on :11434 via host.docker.internal.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner context
        run: |
          set -e
          echo "Runner: $(hostname) – user $(whoami)"
          docker --version
          docker compose version

      - name: Resolve host config
        run: |
          set -e
          # Deploy target lives under the runner user's home ($HOME), not a
          # hardcoded Linux path — macOS home is /Users/<user>.
          echo "DEPLOY_DIR=$HOME/deployments/jobshout" >> "$GITHUB_ENV"

          # Detect the runner's primary LAN IP from the default route so the
          # deploy never depends on a stale hardcoded address. Works on both
          # macOS (route get / ipconfig) and Linux (ip route); falls back to
          # localhost if detection fails.
          host_ip=""
          if command -v route >/dev/null 2>&1 && command -v ipconfig >/dev/null 2>&1; then
            iface="$(route -n get default 2>/dev/null | awk '/interface:/{print $2}')"
            [ -n "$iface" ] && host_ip="$(ipconfig getifaddr "$iface" 2>/dev/null || true)"
          fi
          if [ -z "$host_ip" ] && command -v ip >/dev/null 2>&1; then
            host_ip="$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')"
          fi
          [ -z "$host_ip" ] && host_ip="127.0.0.1"
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"
          echo "Resolved DEPLOY_DIR=$HOME/deployments/jobshout HOST_IP=$host_ip"

      - name: Sync repository to deploy directory
        run: |
          set -e
          mkdir -p "$DEPLOY_DIR"
          # rsync preserves the stack state (e.g. .env secrets) across deploys
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'server/bin' \
            --exclude '.dev-logs' \
            ./ "$DEPLOY_DIR/"

      - name: Render .env for deploy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -e
          cat > .env <<EOF
          # Generated by GH Actions deploy workflow
          UI_HOST_PORT=${UI_HOST_PORT}
          SERVER_HOST_PORT=${SERVER_HOST_PORT}
          POSTGRES_HOST_PORT=${POSTGRES_HOST_PORT}
          MINIO_API_HOST_PORT=${MINIO_API_HOST_PORT}
          MINIO_CONSOLE_HOST_PORT=${MINIO_CONSOLE_HOST_PORT}

          POSTGRES_USER=jobshout
          POSTGRES_PASSWORD=jobshout
          POSTGRES_DB=jobshout
          DATABASE_URL=postgres://jobshout:jobshout@postgres:5432/jobshout?sslmode=disable

          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-dev-jwt-secret-change-me-please-32chars' }}
          JWT_EXPIRY_MINUTES=15
          JWT_REFRESH_EXPIRY_DAYS=7

          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_USE_SSL=false
          MINIO_BUCKET_AVATARS=avatars
          MINIO_BUCKET_KNOWLEDGE=knowledge

          SERVER_PORT=:8080
          CORS_ORIGINS=https://dev.jobshout.co.uk,http://localhost:${UI_HOST_PORT},http://${HOST_IP}:${UI_HOST_PORT}

          NEXT_PUBLIC_API_URL=https://dev-api.jobshout.co.uk
          NEXT_PUBLIC_WS_URL=wss://dev-api.jobshout.co.uk

          LLM_PROVIDER=ollama
          # Reach the host's Ollama via Docker Desktop's host gateway. The
          # compose file maps host.docker.internal -> host-gateway via
          # extra_hosts, so this resolves from inside the containers on both
          # macOS and Linux without depending on the host's LAN IP.
          OLLAMA_BASE_URL=http://host.docker.internal:11434
          OLLAMA_DEFAULT_MODEL=llama3:latest
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=https://api.openai.com/v1
          OPENAI_DEFAULT_MODEL=gpt-4o-mini
          PYTHON_SIDECAR_URL=http://python-sidecar:8001
          PYTHON_SIDECAR_SECRET=${{ secrets.PYTHON_SIDECAR_SECRET || 'ci-dev-sidecar-secret' }}

          # Blog generator — optional. Token must have repo scope (or
          # fine-grained Contents+PRs) on bwalia/workstation-website.
          GITHUB_TOKEN=${{ secrets.BLOG_GITHUB_TOKEN }}
          GITHUB_USER_NAME=JobShout Bot
          GITHUB_USER_EMAIL=bot@jobshout.local
          BLOG_REPO_OWNER=bwalia
          BLOG_REPO_NAME=workstation-website
          BLOG_BASE_BRANCH=main
          BLOG_WORK_DIR=/tmp/jobshout-blog
          EOF
          chmod 600 .env

      - name: Build images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p jobshout build --pull

      - name: Stop previous stack (preserve volumes)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Drop any containers from a prior (possibly half-failed) deploy so
          # port bindings are released before we bring the stack back up.
          docker compose -p jobshout down --remove-orphans || true

      - name: Bring stack up
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose -p jobshout up -d --remove-orphans

      - name: Wait for health
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -e
          echo "Waiting up to 3 minutes for services to become healthy..."
          for i in $(seq 1 36); do
            unhealthy="$(docker compose -p jobshout ps --format json \
              | (command -v jq >/dev/null && jq -r 'select(.Health != "" and .Health != "healthy") | .Name' \
                 || grep -oE '"Health":"[^"]+"[^}]*"Name":"[^"]+"' | grep -v '"healthy"' | grep -oE '"Name":"[^"]+"' | cut -d'"' -f4) \
              || true)"
            if [ -z "$unhealthy" ]; then
              echo "All healthchecked services are healthy."
              break
            fi
            echo "Still waiting on: $unhealthy"
            sleep 5
          done
          docker compose -p jobshout ps

      - name: Smoke-test exposed ports
        run: |
          set -e
          fail=0

          # Retry an HTTP check up to 12 times (1m) — services without a
          # compose healthcheck (server, ui) may still be binding ports.
          check_http() {
            local name="$1" url="$2" port="$3"
            for i in $(seq 1 12); do
              if curl -fsS --max-time 5 "$url" -o /dev/null; then
                echo "OK   $name -> $url"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $name -> $url (after retries)"
            fail=1
          }

          check_tcp() {
            local name="$1" port="$2"
            for i in $(seq 1 12); do
              if bash -c "</dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                echo "TCP  $name -> 127.0.0.1:${port} open"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $name -> 127.0.0.1:${port} (after retries)"
            fail=1
          }

          # Published ports bind 0.0.0.0, so probe loopback — the most reliable
          # host-side check regardless of the runner's LAN IP.
          check_http "UI"            "http://127.0.0.1:${UI_HOST_PORT}"              "${UI_HOST_PORT}"
          check_http "API"           "http://127.0.0.1:${SERVER_HOST_PORT}/health"   "${SERVER_HOST_PORT}"
          check_http "MinIO API"     "http://127.0.0.1:${MINIO_API_HOST_PORT}/minio/health/ready" "${MINIO_API_HOST_PORT}"
          check_http "MinIO console" "http://127.0.0.1:${MINIO_CONSOLE_HOST_PORT}"   "${MINIO_CONSOLE_HOST_PORT}"
          check_http "Ollama (host)" "http://127.0.0.1:11434/"                       "11434"
          check_tcp  "Postgres"      "${POSTGRES_HOST_PORT}"
          exit $fail

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## JobShout deployment"
            echo ""
            echo "Host: \`${HOST_IP}\`"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| UI | http://${HOST_IP}:${UI_HOST_PORT} |"
            echo "| API | http://${HOST_IP}:${SERVER_HOST_PORT} |"
            echo "| MinIO API | http://${HOST_IP}:${MINIO_API_HOST_PORT} |"
            echo "| MinIO console | http://${HOST_IP}:${MINIO_CONSOLE_HOST_PORT} |"
            echo "| Ollama (host, not managed by compose) | http://${HOST_IP}:11434 |"
            echo "| Postgres | ${HOST_IP}:${POSTGRES_HOST_PORT} |"
          } >> "$GITHUB_STEP_SUMMARY"
