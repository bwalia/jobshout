name: Ops — rebuild jobshout-com images & seed

# One-shot: rebuild marketplace images from this branch (includes QEMU timeout
# fix) and seed Ring Promoter. Wait for the next release tag on ubuntu so we
# do not occupy the self-hosted Mac runner (which deploy-k3s needs).

on:
  push:
    branches: [cursor/jobshout-com-build-timeout-618f]

concurrency:
  group: ops-rebuild-jobshout-com
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: int-spectoncr.diytaxreturn.co.uk
  IMAGE_NAMESPACE: jobshout-com
  RP_APP: jobshout-com
  TARGET_ENV: int

jobs:
  wait-tag:
    name: Wait for tag after v1.0.225
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for newer release tag
        id: ver
        run: |
          set -euo pipefail
          BASELINE=v1.0.225
          deadline=$((SECONDS + 100 * 60))
          VERSION=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            git fetch --tags origin
            tip=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            echo "tip=$tip baseline=$BASELINE"
            if [ -n "$tip" ] && [ "$tip" != "$BASELINE" ]; then
              newest=$(printf '%s\n%s\n' "$BASELINE" "$tip" | sort -V | tail -1)
              if [ "$newest" = "$tip" ]; then
                VERSION=$tip
                break
              fi
            fi
            sleep 30
          done
          if [ -z "$VERSION" ]; then
            echo "::error::timed out waiting for a tag newer than $BASELINE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Will rebuild jobshout-com for $VERSION"

  rebuild-and-seed:
    name: Rebuild api+web & seed int
    needs: [wait-tag]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Pick LAN SpectonCR NodePort
        id: push_host
        run: |
          set -euo pipefail
          REGISTRY_HOSTS="192.168.1.23 192.168.1.140 192.168.1.104 192.168.1.47 192.168.1.36"
          RELAY_HOST=$(.github/scripts/registry-relay.sh "$REGISTRY_HOSTS" || true)
          echo "RELAY_HOST=$RELAY_HOST" >> "$GITHUB_ENV"
          PUSH=""
          if [ -n "$RELAY_HOST" ]; then
            PUSH="${RELAY_HOST}:30500"
            REGISTRY_HOSTS="$RELAY_HOST $REGISTRY_HOSTS"
          fi
          for h in $REGISTRY_HOSTS; do
            [ -n "$PUSH" ] && break
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 5 \
              "http://${h}:30500/v2/" || echo 000)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              PUSH="${h}:30500"
              break
            fi
          done
          if [ -z "$PUSH" ]; then
            echo "::error::SpectonCR NodePort :30500 not reachable on the LAN."
            exit 1
          fi
          echo "host=$PUSH" >> "$GITHUB_OUTPUT"
          echo "PUSH_REGISTRY=$PUSH" >> "$GITHUB_ENV"
          echo "REGISTRY_HOSTS=$REGISTRY_HOSTS" >> "$GITHUB_ENV"

      - name: Registry login
        env:
          PUSH_REGISTRY: ${{ steps.push_host.outputs.host }}
        run: |
          set -euo pipefail
          docker login "$IMAGE_REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path.home() / ".docker" / "config.json"
          cfg = json.loads(p.read_text()) if p.exists() else {}
          auths = cfg.setdefault("auths", {})
          want = os.environ["IMAGE_REGISTRY"]
          src = next((v for k, v in auths.items() if want in k), None)
          if not src:
              raise SystemExit(f"docker login did not store auth for {want}")
          hosts = [f"{h}:30500" for h in os.environ["REGISTRY_HOSTS"].split()]
          for host in hosts:
              auths[host] = src
              auths[f"http://{host}"] = src
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - name: Buildx linux/amd64 api + web
        env:
          PUSH_REGISTRY: ${{ steps.push_host.outputs.host }}
        run: |
          set -euo pipefail
          [ -n "${RELAY_HOST:-}" ] && .github/scripts/registry-relay.sh "192.168.1.23 192.168.1.140 192.168.1.104 192.168.1.47 192.168.1.36" >/dev/null || true
          VERSION="${{ needs.wait-tag.outputs.version }}"
          CFG="${RUNNER_TEMP:-/tmp}/jobshout-com-buildkitd.toml"
          python3 - "$CFG" <<'PY'
          from pathlib import Path
          import os, sys
          hosts = [f"{h}:30500" for h in os.environ["REGISTRY_HOSTS"].split()]
          relay = f'{os.environ.get("RELAY_HOST", "")}:30500'
          Path(sys.argv[1]).write_text("".join(
              f'[registry."{h}"]\n  http = true\n' + ("" if h == relay else "  insecure = true\n")
              for h in hosts
          ))
          PY
          docker buildx rm jobshout-com-lan >/dev/null 2>&1 || true
          docker buildx create --name jobshout-com-lan --driver docker-container --bootstrap --config "$CFG"
          NS="$PUSH_REGISTRY/$IMAGE_NAMESPACE"
          bx() {
            docker buildx build --builder jobshout-com-lan --platform linux/amd64 \
              --provenance=false --sbom=false --push "$@"
          }
          bx -f jobshout-com/deploy/docker/Dockerfile.api \
            -t "$NS/api:$VERSION" -t "$NS/api:latest" \
            jobshout-com
          bx -f jobshout-com/deploy/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_JOBSHOUT_COM_API_URL="" \
            --build-arg JOBSHOUT_COM_API_URL=http://jobshout-com-api:8088 \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg APP_GIT_SHA="$GITHUB_SHA" \
            --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            -t "$NS/web:$VERSION" -t "$NS/web:latest" \
            jobshout-com/web/nextjs
          echo "Pushed $NS/{api,web}:$VERSION"

      - name: Clear stuck Helm pending lock (int)
        env:
          KUBE_CONFIG_DATA_K3S: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
        run: |
          set -euo pipefail
          NS=int
          RELEASE=jobshout-com
          KUBECONFIG_PATH="${RUNNER_TEMP:-/tmp}/k3s1.kubeconfig"
          if [ -z "${KUBE_CONFIG_DATA_K3S:-}" ]; then
            echo "::warning::KUBE_CONFIG_DATA_K3S unset — skip helm lock clear"
            exit 0
          fi
          printf '%s' "$KUBE_CONFIG_DATA_K3S" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          export KUBECONFIG="$KUBECONFIG_PATH"
          for status in pending-install pending-upgrade pending-rollback; do
            names=$(kubectl -n "$NS" get secret \
              -l "owner=helm,name=${RELEASE},status=${status}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
            if [ -n "$names" ]; then
              echo "Deleting ${status} secrets:"
              echo "$names"
              # shellcheck disable=SC2086
              kubectl -n "$NS" delete secret $names --wait=false
            fi
          done

      - name: Seed jobshout-com int and wait healthy
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
        run: |
          set -euo pipefail
          TAG="${{ needs.wait-tag.outputs.version }}"
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          if [ -z "${RP_API_TOKEN:-}" ]; then
            echo "::error::RP_API_TOKEN is not set"; exit 1
          fi
          code=$(curl -sS -o /tmp/seed.out -w '%{http_code}' \
            -X POST "${RP}/api/apps/${RP_APP}/seed?async=1" \
            -H "Authorization: Bearer ${RP_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"ring":"%s","version":"%s"}' "$TARGET_ENV" "$TAG")" || echo 000)
          echo "seed -> HTTP ${code} :: $(cat /tmp/seed.out)"
          case "${code}" in
            200|202) ;;
            *) echo "::error::Ring Promoter seed failed (HTTP ${code})"; exit 1 ;;
          esac
          JOB_ID=$(python3 -c 'import json; print(json.load(open("/tmp/seed.out")).get("job_id") or "")')
          [ -n "$JOB_ID" ] || { echo "::error::no job_id"; exit 1; }
          python3 - "$RP" "$RP_API_TOKEN" "$JOB_ID" "$TAG" "$RP_APP" "$TARGET_ENV" <<'PY'
          import json, sys, time, urllib.error, urllib.request
          rp, token, job_id, tag, app, ring = sys.argv[1:7]
          url = f"{rp}/api/apps/{app}/jobs/{job_id}"
          rings_url = f"{rp}/api/apps/{app}/rings"
          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.load(resp)
              except Exception as e:
                  print(f"::warning::job poll: {e}")
                  time.sleep(15)
                  continue
              status = (body.get("status") or "").lower()
              print(f"RP job {job_id} status={status}")
              req = urllib.request.Request(rings_url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      rings = json.load(resp).get("rings") or []
              except Exception as e:
                  print(f"::warning::rings poll: {e}")
                  time.sleep(15)
                  continue
              for r in rings:
                  if (r.get("ring") or {}).get("name") == ring:
                      if r.get("current_version") == tag and r.get("healthy"):
                          print(f"Deployed {tag} to {ring} and healthy.")
                          sys.exit(0)
              if status in ("failed", "failure", "error", "cancelled"):
                  print(body)
                  sys.exit(1)
              time.sleep(15)
          print("::error::timed out waiting for healthy seed")
          sys.exit(1)
          PY
