name: jobshout-com

on:
  push:
    paths:
      - "jobshout-com/**"
      - ".github/workflows/jobshout-com.yml"
  pull_request:
    paths:
      - "jobshout-com/**"
      - ".github/workflows/jobshout-com.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobshout-com
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobshout-com/web/nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run build
        env:
          JOBSHOUT_COM_API_URL: http://127.0.0.1:8088
