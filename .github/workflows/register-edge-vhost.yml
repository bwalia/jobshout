name: Register edge vhost (Cloudflare + wslproxy)

# Make a JobShout host publicly reachable through the wslproxy edge.
# k3s app hosts (int.jobshout.co.uk, …) stay on the default pop0 CNAME.
# Workstation services (strix.workstation.co.uk) must register on **pop1**.
#
# Secrets:
#   WSLPROXY_USER / WSLPROXY_PASSWORD / WSLPROXY_GATEWAY_URL
#   CLOUDFLARE_API_TOKEN (optional)

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Public host to register (FQDN)"
        required: true
        default: int.jobshout.co.uk
      zone:
        description: "Cloudflare zone the host lives in"
        required: true
        default: jobshout.co.uk
      server_spec:
        description: "Path to the wslproxy server spec JSON"
        required: true
        default: deploy/edge/wslproxy-server-int.json
      health_path:
        description: "Path to probe (/login, /auth/sign-in, /health)"
        required: false
        default: /login
      cname_target:
        description: "CNAME target (lon1.pop0.uk for k3s apps; pop1.wslproxy.com for workstation services)"
        required: false
        default: lon1.pop0.uk
      gateway_url:
        description: "wslproxy admin URL override (empty = WSLPROXY_GATEWAY_URL secret). pop1 = https://pop1.diytaxreturn.co.uk"
        required: false
        default: ""

jobs:
  register:
    name: Register ${{ inputs.host }} on the edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Cloudflare CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOST: ${{ inputs.host }}
          ZONE: ${{ inputs.zone }}
          CNAME_TARGET: ${{ inputs.cname_target || 'lon1.pop0.uk' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — relying on existing DNS for ${HOST} -> ${CNAME_TARGET}."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_id=$(curl -fsS "${auth[@]}" "$api/zones?name=${ZONE}" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::notice::zone ${ZONE} not found for this Cloudflare token — leaving DNS as-is."
            exit 0
          fi
          rec=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=CNAME&name=${HOST}")
          rec_id=$(echo "$rec" | jq -r '.result[0].id // empty')
          body=$(jq -nc --arg name "$HOST" --arg content "$CNAME_TARGET" \
            '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')
          if [ -n "$rec_id" ]; then
            curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$rec_id" --data "$body" >/dev/null
            echo "updated CNAME ${HOST} -> ${CNAME_TARGET}"
          else
            curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$body" >/dev/null
            echo "created CNAME ${HOST} -> ${CNAME_TARGET}"
          fi

      - name: Register wslproxy vhost
        env:
          WSLPROXY_USER: ${{ secrets.WSLPROXY_USER }}
          WSLPROXY_PASSWORD: ${{ secrets.WSLPROXY_PASSWORD }}
          WSLPROXY_GATEWAY_URL: ${{ secrets.WSLPROXY_GATEWAY_URL }}
          GATEWAY_URL_INPUT: ${{ inputs.gateway_url }}
          HOST: ${{ inputs.host }}
          SPEC: ${{ inputs.server_spec }}
        run: |
          set -euo pipefail
          GW="${GATEWAY_URL_INPUT:-}"
          if [ -z "$GW" ]; then
            GW="${WSLPROXY_GATEWAY_URL:-}"
          fi
          if [ -z "${WSLPROXY_USER:-}" ] || [ -z "${WSLPROXY_PASSWORD:-}" ] || [ -z "$GW" ]; then
            echo "::error::WSLPROXY_USER / WSLPROXY_PASSWORD / gateway URL must all be set."
            exit 1
          fi
          if [ ! -f "$SPEC" ]; then
            echo "::error::server spec not found: $SPEC"; exit 1
          fi
          spec_host=$(jq -r '.server_name' "$SPEC")
          if [ "$spec_host" != "$HOST" ]; then
            echo "::error::spec server_name ($spec_host) != host ($HOST)"; exit 1
          fi
          echo "admin API: $GW"
          TOKEN=$(curl -fsS -X POST "$GW/api/user/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg e "$WSLPROXY_USER" --arg p "$WSLPROXY_PASSWORD" '{email:$e,password:$p}')" \
            | jq -r '.data.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::wslproxy login failed for ${WSLPROXY_USER} at ${GW}."; exit 1
          fi

          existing=$(curl -fsS -X GET "$GW/api/servers" -H "Authorization: Bearer $TOKEN" \
            | jq -r --arg h "$HOST" '.data[]? | select(.server_name==$h) | .id' | head -1)
          if [ -n "$existing" ]; then
            echo "wslproxy vhost for ${HOST} already exists (id=$existing) — nothing to do."
            exit 0
          fi

          CLONE=$(jq -r '.clone_from // empty' "$SPEC")
          if [ -n "$CLONE" ]; then
            echo "cloning vhost from ${CLONE}"
            PORT_FROM=$(jq -r '.origin_port_from // "11435"' "$SPEC")
            PORT_TO=$(jq -r '.origin_port_to // "11436"' "$SPEC")
            LIST=$(curl -fsS -X GET "$GW/api/servers" -H "Authorization: Bearer $TOKEN")
            TMPL=$(echo "$LIST" | jq --arg h "$CLONE" '.data[]? | select(.server_name==$h)')
            if [ -z "$TMPL" ] || [ "$TMPL" = "null" ]; then
              echo "::error::clone_from ${CLONE} not found on ${GW}"; exit 1
            fi
            echo "template pops: $(echo "$TMPL" | jq -c '.pop_ids // []')"
            NEW_RULES='[]'
            for rid in $(echo "$TMPL" | jq -r '.rules[]? // empty'); do
              RULE=$(curl -fsS -X GET "$GW/api/rules/$rid" -H "Authorization: Bearer $TOKEN")
              # API may wrap in .data
              RULE_BODY=$(echo "$RULE" | jq 'if .data then .data else . end')
              PATCHED=$(echo "$RULE_BODY" | jq \
                --arg from "$PORT_FROM" --arg to "$PORT_TO" '
                walk(if type=="string" then gsub($from; $to) else . end)
                | del(.id, .created_at, .updated_at, .servers)
              ')
              echo "creating cloned rule (port ${PORT_FROM} -> ${PORT_TO})"
              CREATED=$(curl -fsS -X POST "$GW/api/rules" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d "$PATCHED")
              nid=$(echo "$CREATED" | jq -r '.data.id // .id // empty')
              if [ -z "$nid" ]; then
                echo "::error::rule clone failed: $CREATED"; exit 1
              fi
              NEW_RULES=$(echo "$NEW_RULES" | jq --arg id "$nid" '. + [$id]')
            done
            BODY=$(jq -n \
              --argjson tmpl "$TMPL" \
              --argjson spec "$(jq 'del(.clone_from, .origin_port_from, .origin_port_to)' "$SPEC")" \
              --argjson rules "$NEW_RULES" '
              ($tmpl + $spec)
              | del(.id, .created_at, .updated_at)
              | .rules = (if ($rules|length)>0 then $rules else .rules end)
              | .config_status = true
            ')
            resp=$(curl -fsS -X POST "$GW/api/servers" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$BODY")
          else
            resp=$(curl -fsS -X POST "$GW/api/servers" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d @"$SPEC")
          fi
          sid=$(echo "$resp" | jq -r '.data.id // .id // empty')
          if [ -z "$sid" ]; then
            echo "::error::wslproxy server create failed: $resp"; exit 1
          fi
          echo "registered wslproxy vhost ${HOST} (id=$sid)."

      - name: Verify public health
        env:
          HOST: ${{ inputs.host }}
          HEALTH_PATH: ${{ inputs.health_path || '/login' }}
        run: |
          set -euo pipefail
          # JWT-gated workstation hosts (images/strix) return 403 until x-api-key
          # is presented — that still means the vhost exists. "Host not configured"
          # is the failure.
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/body -m 10 -w '%{http_code}' "https://${HOST}${HEALTH_PATH}" || echo 000)
            body=$(head -c 160 /tmp/body | tr -d '\n')
            echo "[$i] https://${HOST}${HEALTH_PATH} -> $code :: $body"
            if grep -qi 'Host not configured' /tmp/body; then
              sleep 15
              continue
            fi
            if [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "✅ ${HOST} is live through the edge (HTTP ${code})."; exit 0
            fi
            sleep 15
          done
          echo "::error::${HOST} did not become healthy through the edge in time."; exit 1
