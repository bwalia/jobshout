name: Build & deploy JobShout to k3s

# Build the three JobShout images (server, web, python-sidecar) to the SpectonCR
# registry, then hand deployment to Ring Promoter (https://rp.workstation.co.uk).
# Seeding a ring makes RP run the actual deploy as a short-lived k8s Job in the
# ring-exec namespace (git-clone this repo at the seeded tag + helm upgrade into
# the ring's namespace) — the DTAP control plane owns the deploy, not this CI.
#
# Continuous deployment: every push to master builds the images and seeds the
# int ring. Promotion int -> test -> acc -> prod is done from the Ring Promoter
# UI (rp.workstation.co.uk/?app=jobshout). workflow_dispatch can build-only, or
# seed a chosen ring / pinned tag.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment"
        default: "int"
        required: true
        options: [int, test, acc, prod]
      DEPLOYMENT_TYPE:
        type: choice
        description: "Build only, deploy only, or both"
        default: "build-and-deploy"
        required: true
        options: [build, deploy, build-and-deploy]
      IMAGE_TAG:
        type: string
        description: "Image tag to DEPLOY (deploy-only). Blank = this commit's short SHA."
        default: ""
        required: false

concurrency:
  group: jobshout-k3s-${{ github.event.inputs.TARGET_ENV || 'int' }}
  cancel-in-progress: false

env:
  # int-spectoncr.diytaxreturn.co.uk (pop1 edge) is reachable from the jobshout
  # self-hosted runner; spectoncr.workstation.co.uk (pop0) is not. Same registry.
  IMAGE_REGISTRY: int-spectoncr.diytaxreturn.co.uk
  IMAGE_NAMESPACE: jobshout
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'int' }}
  DEPLOYMENT_TYPE: ${{ github.event.inputs.DEPLOYMENT_TYPE || 'build-and-deploy' }}

jobs:
  build:
    name: Build & push images
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Registry login (SpectonCR)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: docker login "$IMAGE_REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Build & push server, web, python-sidecar (linux/amd64)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          NS="$IMAGE_REGISTRY/$IMAGE_NAMESPACE"

          # k3s1 nodes are amd64 but this runner is an arm64 Mac, so cross-build
          # for linux/amd64 with buildx (QEMU) and push directly — same as
          # beaconpulse. Plain `docker build` here produced arm64 images, which
          # failed on the cluster with "no match for platform in manifest"
          # (ImagePullBackOff). A docker-container builder is required for
          # --platform cross-builds; create it once (idempotent).
          docker buildx inspect jsbuilder >/dev/null 2>&1 \
            || docker buildx create --name jsbuilder --driver docker-container --bootstrap
          bx() { docker buildx build --builder jsbuilder --platform linux/amd64 --push "$@"; }

          bx -f server/Dockerfile -t "$NS/server:$SHA" -t "$NS/server:latest" server

          # NEXT_PUBLIC_* are baked at BUILD time, so build same-origin (empty
          # base): the browser calls /api and /ws on whichever host serves it, so
          # ONE image is valid for every ring.
          bx --build-arg NEXT_PUBLIC_API_URL="" --build-arg NEXT_PUBLIC_WS_URL="" \
            -f web/nextjs/Dockerfile -t "$NS/web:$SHA" -t "$NS/web:latest" web/nextjs

          bx -f python-sidecar/Dockerfile \
            -t "$NS/python-sidecar:$SHA" -t "$NS/python-sidecar:latest" python-sidecar

  deploy:
    name: Seed Ring Promoter (${{ github.event.inputs.TARGET_ENV || 'int' }})
    needs: [build]
    runs-on: self-hosted
    steps:
      - name: Seed Ring Promoter — RP runs the k8sjob deploy
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.IMAGE_TAG }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA::7}"
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          if [ -z "${RP_API_TOKEN:-}" ]; then
            echo "::error::RP_API_TOKEN is not set — cannot seed Ring Promoter."
            exit 1
          fi
          echo "Seeding jobshout '${TARGET_ENV}' @ ${TAG} via Ring Promoter…"
          # Ring Promoter runs the actual deploy as a k8sjob in ring-exec (git
          # clones this repo at the seeded tag and helm-installs into the ring's
          # namespace, with externalSecret off + registry creds handled cluster-
          # side). Promotion int -> test -> acc -> prod is done in the RP UI.
          code=$(curl -sS -o /tmp/seed.out -w '%{http_code}' \
            -X POST "${RP}/api/apps/jobshout/seed?async=1" \
            -H "Authorization: Bearer ${RP_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"ring":"%s","version":"%s"}' "$TARGET_ENV" "$TAG")" || echo 000)
          echo "seed -> HTTP ${code} :: $(cat /tmp/seed.out)"
          case "${code}" in
            200|202) echo "Seeded — Ring Promoter is running the deploy. Track: ${RP}/?app=jobshout" ;;
            *) echo "::error::Ring Promoter seed failed (HTTP ${code})"; exit 1 ;;
          esac
