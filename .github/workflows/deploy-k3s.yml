name: Build images & seed Ring Promoter (k3s DTAP)

# Build and push the three JobShout images, then hand off to Ring Promoter,
# which performs the actual k3s deploy (via its k8sjob deployer) and drives
# promotion int -> test -> acc -> prod from https://rp.workstation.co.uk/?app=jobshout.
#
# This workflow deliberately does NOT run helm/kubectl itself: Ring Promoter is
# the single deploy path. On push to master it builds the images at the commit
# SHA, pushes them to the chart's registry, then POSTs that version to the
# `int` ring. Promotion onward is a human/gated action in the Ring Promoter UI.
#
# Borrowed from beaconpulse's deploy-k3s.yml (build/push) + ring-promoter's
# "app CI calls the API" pattern (seed).
#
# Secrets:
#   REGISTRY_USERNAME / REGISTRY_PASSWORD   push to the chart's OCI registry
#   RP_API_TOKEN                            Ring Promoter bearer token
#   RP_URL (optional)                       defaults to https://rp.workstation.co.uk

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: jobshout-k3s-images
  cancel-in-progress: false

env:
  # Matches deploy/helm/jobshout/values.yaml image.{registry,namespace}. The
  # same SHA-tagged images are promoted through every ring, so one registry.
  IMAGE_REGISTRY: int-spectoncr.diytaxreturn.co.uk
  IMAGE_NAMESPACE: jobshout

jobs:
  build:
    name: Build & push images
    runs-on: [self-hosted, int]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Registry login
        run: docker login "$IMAGE_REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Build & push server, web, python-sidecar
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          NS="$IMAGE_REGISTRY/$IMAGE_NAMESPACE"

          # server (Go API) -> repo "server"
          docker build -f server/Dockerfile \
            -t "$NS/server:$SHA" -t "$NS/server:latest" server
          docker push "$NS/server:$SHA"
          docker push "$NS/server:latest"

          # web (Next.js) -> repo "web". NEXT_PUBLIC_* are baked at BUILD time,
          # so build same-origin (empty base): the browser then calls /api and
          # /ws on whichever host serves it, making ONE image valid for every
          # ring. The chart's per-env web.publicApiURL is consequently inert for
          # these NEXT_PUBLIC vars (kept only for documentation).
          docker build -f web/nextjs/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="" \
            --build-arg NEXT_PUBLIC_WS_URL="" \
            -t "$NS/web:$SHA" -t "$NS/web:latest" web/nextjs
          docker push "$NS/web:$SHA"
          docker push "$NS/web:latest"

          # python-sidecar -> repo "python-sidecar"
          docker build -f python-sidecar/Dockerfile \
            -t "$NS/python-sidecar:$SHA" -t "$NS/python-sidecar:latest" python-sidecar
          docker push "$NS/python-sidecar:$SHA"
          docker push "$NS/python-sidecar:latest"

      - name: Seed the int ring in Ring Promoter
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          if [ -z "${RP_API_TOKEN:-}" ]; then
            echo "::notice::RP_API_TOKEN not set — images pushed ($SHA) but Ring Promoter was not seeded. Seed manually: POST ${RP}/api/apps/jobshout/seed {\"ring\":\"int\",\"version\":\"$SHA\"}"
            exit 0
          fi
          # async=1 -> RP runs the k8sjob deploy detached and returns 202 {job_id}.
          code=$(curl -sS -o /tmp/seed.out -w '%{http_code}' \
            -X POST "${RP}/api/apps/jobshout/seed?async=1" \
            -H "Authorization: Bearer ${RP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"ring":"int","version":"%s"}' "$SHA")" || echo 000)
          echo "seed -> HTTP $code :: $(cat /tmp/seed.out)"
          case "$code" in
            200|202) echo "Seeded jobshout int @ $SHA — track it at ${RP}/?app=jobshout" ;;
            *) echo "::error::Ring Promoter seed failed (HTTP $code)"; exit 1 ;;
          esac
