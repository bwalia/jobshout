name: Build & deploy JobShout to k3s

# Build the three JobShout images (server, web, python-sidecar) to the SpectonCR
# registry, then hand deployment to Ring Promoter (https://rp.workstation.co.uk).
# Seeding a ring makes RP run the actual deploy as a short-lived k8s Job in the
# ring-exec namespace (git-clone this repo at the seeded tag + helm upgrade into
# the ring's namespace) — the DTAP control plane owns the deploy, not this CI.
#
# This workflow is green only after Ring Promoter reports the seeded version
# healthy on the target ring — not when the seed HTTP call is merely accepted.
#
# Continuous deployment: every push to master builds the images and seeds the
# int ring. Promotion int -> test -> acc -> prod is done from the Ring Promoter
# UI (rp.workstation.co.uk/?app=jobshout). workflow_dispatch can build-only, or
# seed a chosen ring / pinned tag.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment"
        default: "int"
        required: true
        options: [int, test, acc, prod]
      DEPLOYMENT_TYPE:
        type: choice
        description: "Build only, deploy only, or both"
        default: "build-and-deploy"
        required: true
        options: [build, deploy, build-and-deploy]
      IMAGE_TAG:
        type: string
        description: "Image tag to DEPLOY (deploy-only). Blank = this commit's short SHA."
        default: ""
        required: false

concurrency:
  group: jobshout-k3s-${{ github.event.inputs.TARGET_ENV || 'int' }}
  cancel-in-progress: false

env:
  # int-spectoncr.diytaxreturn.co.uk (pop1 edge) is reachable from the jobshout
  # self-hosted runner; spectoncr.workstation.co.uk (pop0) is not. Same registry.
  IMAGE_REGISTRY: int-spectoncr.diytaxreturn.co.uk
  IMAGE_NAMESPACE: jobshout
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'int' }}
  DEPLOYMENT_TYPE: ${{ github.event.inputs.DEPLOYMENT_TYPE || 'build-and-deploy' }}

jobs:
  build:
    name: Build & push images
    runs-on: self-hosted
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Registry login (SpectonCR)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: docker login "$IMAGE_REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Build & push server, web, python-sidecar (linux/amd64)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          NS="$IMAGE_REGISTRY/$IMAGE_NAMESPACE"

          # k3s1 nodes are amd64 but this runner is an arm64 Mac, so cross-build
          # for linux/amd64 with buildx (QEMU) and push directly — same as
          # beaconpulse. Plain `docker build` here produced arm64 images, which
          # failed on the cluster with "no match for platform in manifest"
          # (ImagePullBackOff). A docker-container builder is required for
          # --platform cross-builds; create it once (idempotent).
          #
          # Provenance/SBOM attestations are off on purpose. buildx otherwise
          # pushes an OCI index with an unknown/unknown attestation that k3s
          # containerd rejects with the same "no match for platform" error —
          # which is what happened to web/server:40e5c53 on int.
          docker buildx inspect jsbuilder >/dev/null 2>&1 \
            || docker buildx create --name jsbuilder --driver docker-container --bootstrap
          bx() {
            docker buildx build --builder jsbuilder --platform linux/amd64 \
              --provenance=false --sbom=false --push "$@"
          }

          bx -f server/Dockerfile -t "$NS/server:$SHA" -t "$NS/server:latest" server

          # NEXT_PUBLIC_* are baked at BUILD time, so build same-origin (empty
          # base): the browser calls /api and /ws on whichever host serves it, so
          # ONE image is valid for every ring.
          bx --build-arg NEXT_PUBLIC_API_URL="" --build-arg NEXT_PUBLIC_WS_URL="" \
            -f web/nextjs/Dockerfile -t "$NS/web:$SHA" -t "$NS/web:latest" web/nextjs

          bx -f python-sidecar/Dockerfile \
            -t "$NS/python-sidecar:$SHA" -t "$NS/python-sidecar:latest" python-sidecar

      - name: Assert pushed images are linux/amd64
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          NS="$IMAGE_REGISTRY/$IMAGE_NAMESPACE"

          # A single-platform OCI manifest does not print "linux/amd64" in
          # `imagetools inspect` text — only indexes do. Reject attestation
          # indexes / arm64 lists; prove amd64 by running the image.
          assert_not_multiarch_junk() {
            local img="$1"
            echo "Inspecting $img"
            docker buildx imagetools inspect "$img"
            python3 - "$img" <<'PY'
          import json, subprocess, sys
          img = sys.argv[1]
          raw = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw", img]
          )
          m = json.loads(raw)
          mt = m.get("mediaType") or ""
          if "index" not in mt and "manifest.list" not in mt:
              print(f"OK {img} is a single manifest (runtime smoke checks arch)")
              sys.exit(0)
          plats = []
          for e in m.get("manifests") or []:
              p = e.get("platform") or {}
              os_, arch = p.get("os") or "", p.get("architecture") or ""
              if os_ == "unknown" or arch == "unknown":
                  print(f"::error::{img}: attestation/unknown platform in index: {p}", file=sys.stderr)
                  sys.exit(1)
              if arch == "arm64":
                  print(f"::error::{img}: index includes linux/arm64", file=sys.stderr)
                  sys.exit(1)
              plats.append(f"{os_}/{arch}")
          if "linux/amd64" not in plats:
              print(f"::error::{img}: index has no linux/amd64 ({plats})", file=sys.stderr)
              sys.exit(1)
          print(f"OK {img} index platforms={plats}")
          PY
          }

          assert_not_multiarch_junk "$NS/server:$SHA"
          assert_not_multiarch_junk "$NS/web:$SHA"
          assert_not_multiarch_junk "$NS/python-sidecar:$SHA"

          echo "Runtime arch smoke (uname -m must be x86_64 under --platform=linux/amd64)"
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh "$NS/server:$SHA" \
            -c 'test -x /app/jobshout-server && uname -m | grep -qx x86_64'
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh "$NS/web:$SHA" \
            -c 'uname -m | grep -qx x86_64'
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh "$NS/python-sidecar:$SHA" \
            -c 'uname -m | grep -qx x86_64'

  deploy:
    name: Seed Ring Promoter (${{ github.event.inputs.TARGET_ENV || 'int' }})
    needs: [build]
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Seed Ring Promoter and wait until the ring is healthy
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.IMAGE_TAG }}"
          [ -z "$TAG" ] && TAG="${{ needs.build.outputs.sha }}"
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          if [ -z "${RP_API_TOKEN:-}" ]; then
            echo "::error::RP_API_TOKEN is not set — cannot seed Ring Promoter."
            exit 1
          fi
          echo "Seeding jobshout '${TARGET_ENV}' @ ${TAG} via Ring Promoter…"
          # Ring Promoter runs the actual deploy as a k8sjob in ring-exec (git
          # clones this repo at the seeded tag and helm-installs into the ring's
          # namespace, with externalSecret off + registry creds handled cluster-
          # side). Promotion int -> test -> acc -> prod is done in the RP UI.
          code=$(curl -sS -o /tmp/seed.out -w '%{http_code}' \
            -X POST "${RP}/api/apps/jobshout/seed?async=1" \
            -H "Authorization: Bearer ${RP_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"ring":"%s","version":"%s"}' "$TARGET_ENV" "$TAG")" || echo 000)
          echo "seed -> HTTP ${code} :: $(cat /tmp/seed.out)"
          case "${code}" in
            200|202) ;;
            *) echo "::error::Ring Promoter seed failed (HTTP ${code})"; exit 1 ;;
          esac

          JOB_ID=$(python3 -c 'import json,sys; print(json.load(open("/tmp/seed.out")).get("job_id") or "")')
          if [ -z "$JOB_ID" ]; then
            echo "::error::seed response had no job_id — cannot wait for rollout"
            exit 1
          fi
          echo "Waiting for Ring Promoter job ${JOB_ID} (version ${TAG})…"
          echo "Track: ${RP}/?app=jobshout"

          python3 - "$RP" "$RP_API_TOKEN" "$JOB_ID" "$TAG" <<'PY'
          import json, sys, time, urllib.error, urllib.request

          rp, token, job_id, tag = sys.argv[1:5]
          url = f"{rp}/api/apps/jobshout/jobs/{job_id}"
          deadline = time.time() + 15 * 60
          last = None

          def dump_logs(body):
              for step in body.get("steps") or []:
                  print(f"--- step {step.get('id')} status={step.get('status')} ---")
                  for line in step.get("logs") or []:
                      print(line)

          while time.time() < deadline:
              req = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {token}"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"::warning::job poll HTTP {e.code}")
                  time.sleep(15)
                  continue
              status = (body.get("status") or "").lower()
              if body != last:
                  print(f"RP job {job_id} status={status}")
                  last = {k: body.get(k) for k in ("status", "finished_at")}
              if status == "success":
                  result = body.get("result") or {}
                  state = result.get("state") or {}
                  current = state.get("current_version") or ""
                  dump_logs(body)
                  if result.get("success") is False:
                      print("::error::RP job marked success but result.success is false")
                      sys.exit(1)
                  if current and current != tag:
                      print(f"::error::int current_version={current} != seeded {tag}")
                      sys.exit(1)
                  if not current:
                      print("::warning::RP did not return current_version; trusting job success")
                  print(f"Deployed {tag} and healthy (current_version={current or tag})")
                  sys.exit(0)
              if status in ("failed", "failure", "error"):
                  dump_logs(body)
                  msg = (body.get("result") or {}).get("message") or status
                  print(f"::error::Ring Promoter deploy failed: {msg}")
                  sys.exit(1)
              time.sleep(15)

          print("::error::timed out waiting for Ring Promoter job (15m)")
          sys.exit(1)
          PY
