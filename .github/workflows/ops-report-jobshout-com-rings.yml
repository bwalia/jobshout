name: Ops — report jobshout-com rings

on:
  push:
    branches: [cursor/clear-jobshout-com-helm-lock-0fd1]
    paths:
      - '.github/workflows/ops-report-jobshout-com-rings.yml'

concurrency:
  group: ops-report-jobshout-com-rings
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report rings
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
        run: |
          set -euo pipefail
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          curl -sS -H "Authorization: Bearer ${RP_API_TOKEN}" \
            "${RP}/api/apps/jobshout-com/rings" | tee /tmp/rings.json | python3 -m json.tool
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/rings.json"))
          for r in data.get("rings") or []:
              name=(r.get("ring") or {}).get("name")
              print(f"{name:5} version={r.get('current_version')} healthy={r.get('healthy')} auto_promote={r.get('auto_promote')} updated={r.get('updated_at')}")
          PY
