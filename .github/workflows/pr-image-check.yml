name: PR image check

# Cross-build the four k3s images for linux/amd64 without pushing or seeding
# Ring Promoter. Auto-merge is not used; this is the pre-merge gate so a broken
# Dockerfile fails on the PR instead of after it hits master.

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-image-check:
    name: PR image check
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cross-build linux/amd64 (no push)
        run: |
          set -euo pipefail
          docker buildx inspect jsbuilder >/dev/null 2>&1 \
            || docker buildx create --name jsbuilder --driver docker-container --bootstrap
          bx() {
            docker buildx build --builder jsbuilder --platform linux/amd64 \
              --provenance=false --sbom=false --load "$@"
          }

          bx -t jobshout/server:pr -f server/Dockerfile server
          bx --build-arg NEXT_PUBLIC_API_URL="" --build-arg NEXT_PUBLIC_WS_URL="" \
            -t jobshout/web:pr -f web/nextjs/Dockerfile web/nextjs
          bx -t jobshout/python-sidecar:pr -f python-sidecar/Dockerfile python-sidecar
          bx -t jobshout/review-bot:pr -f review-bot/Dockerfile review-bot

          for img in jobshout/server:pr jobshout/web:pr jobshout/python-sidecar:pr jobshout/review-bot:pr; do
            arch=$(docker image inspect --format '{{.Architecture}}' "$img")
            echo "$img architecture=$arch"
            [ "$arch" = "amd64" ]
          done

          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh jobshout/server:pr \
            -c 'test -x /app/jobshout-server && uname -m | grep -qx x86_64'
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh jobshout/web:pr \
            -c 'uname -m | grep -qx x86_64'
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh jobshout/python-sidecar:pr \
            -c 'uname -m | grep -qx x86_64'
          docker run --rm --platform=linux/amd64 --entrypoint /bin/sh jobshout/review-bot:pr \
            -c 'uname -m | grep -qx x86_64 && command -v opencode >/dev/null && command -v git >/dev/null'
