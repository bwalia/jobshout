# Prometheus config for the JobShout docker-compose stack.
#
# Scrapes the Go server's /metrics endpoint (already wired via
# promhttp.Handler in server/cmd/server/main.go).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: jobshout-server
    metrics_path: /metrics
    static_configs:
      - targets: ['jobshout-server:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
